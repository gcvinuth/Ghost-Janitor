    /* Underworld Shop UI Logic */
    function renderShopItems() {
      const grid = document.getElementById('shopItemsGrid');
      if (!grid) return;
      grid.innerHTML = '';

      Object.values(upgrades).forEach(up => {
        const card = document.createElement('div');
        card.className = 'shop-item-card';

        const info = document.createElement('div');
        info.className = 'shop-item-info';
        info.innerHTML = `
          <div class="shop-item-name">${up.icon} ${up.name}</div>
          <div class="shop-item-desc">${up.desc}</div>
        `;

        const btn = document.createElement('button');
        btn.className = `shop-item-buy-btn ${up.owned ? 'owned' : ''}`;
        btn.textContent = up.owned ? 'OWNED ✔' : `${up.cost} PTS`;
        btn.disabled = up.owned || playerPoints < up.cost;

        btn.onclick = () => {
          if (!up.owned && playerPoints >= up.cost) {
            playerPoints -= up.cost;
            up.owned = true;
            audio.playVictory();
            renderShopItems();
            updateUI();
          }
        };

        card.appendChild(info);
        card.appendChild(btn);
        grid.appendChild(card);
      });
    }

    function toggleShop(open = null) {
      const modal = document.getElementById('shopModal');
      const isCurrentlyOpen = modal.classList.contains('open');
      const shouldOpen = (open !== null) ? open : !isCurrentlyOpen;

      if (shouldOpen) {
        renderShopItems();
        modal.classList.add('open');
      } else {
        modal.classList.remove('open');
      }
    }

    document.getElementById('shopCloseBtn')?.addEventListener('click', () => {
      toggleShop(false);
      if (levelCleared) {
        loadLevel(currentLevelIndex + 1);
      }
    });

    /* ==========================================================================
       POSSESSION & INTERACTION SYSTEM
       ========================================================================== */
    function togglePossession(targetOverride = null) {
      audio.init();
      if (navigator.vibrate) {
        try { navigator.vibrate(14); } catch (_) {}
      }

      if (busted) {
        loadLevel(currentLevelIndex);
        return;
      }

      if (levelCleared) {
        toggleShop(true);
        return;
      }

      // Check if near Pipe Valve to turn it off in Flooded Basement
      if (pipeValveObj && !pipeValveObj.turnedOff) {
        const distToValve = Math.hypot(player.x - pipeValveObj.x, player.y - pipeValveObj.y);
        if (distToValve <= 45) {
          pipeValveObj.turnedOff = true;
          audio.playValveTurn();
          triggerScreenShake(6, 0.3);
          floatingTexts.push({ text: "VALVE CLOSED! FLOOD RECEDING! 🚰", x: pipeValveObj.x, y: pipeValveObj.y - 20, life: 1.5, color: "#00f0ff" });
          spawnPoofParticles(pipeValveObj.x, pipeValveObj.y, '#00f0ff');
          return;
        }
      }

      // 1. EJECT IF POSSESSING
      if (player.isPossessing) {
        const furn = player.possessedFurniture;
        
        if (furn && furn.isDistraction) {
          triggerDistractionWave(furn.x, furn.y, furn.type);
          floatingTexts.push({
            text: (furn.type === 'clock' ? "RINGGG! ⏰" : "STATIC BLAST! 📺"),
            x: player.x,
            y: player.y - 18,
            life: 1.0,
            color: "#00f0ff"
          });
          furn.isPossessed = false;
          player.isPossessing = false;
          player.possessedFurniture = null;
          audio.playUnpossess();
          spawnPoofParticles(player.x, player.y, '#9d4edd');
          updateUI();
          return;
        }

        if (furn) {
          furn.isPossessed = false;
          if (furn.isMobileTool) {
            furn.x = player.x;
            furn.y = player.y;
          }
        }
        player.isPossessing = false;
        player.possessedFurniture = null;

        audio.playUnpossess();
        spawnPoofParticles(player.x, player.y, '#9d4edd');
        floatingTexts.push({ text: "EJECTED!", x: player.x, y: player.y - 14, life: 0.8, color: "#00f0ff" });
      } 
      // 2. POSSESS NEAREST OBJECT
      else {
        let targetFurn = targetOverride || closestFurniture;
        
        if (!targetFurn) {
          let minDist = 64;
          furnitureList.forEach(furn => {
            const d = Math.hypot(player.x - furn.x, player.y - furn.y);
            if (d < minDist) {
              targetFurn = furn;
              minDist = d;
            }
          });
        }

        if (targetFurn) {
          player.isPossessing = true;
          player.possessedFurniture = targetFurn;
          targetFurn.isPossessed = true;
          player.x = targetFurn.x;
          player.y = targetFurn.y;

          audio.playPossess();
          spawnPoofParticles(player.x, player.y, '#39ff14');

          let possessLabel = `HIDDEN IN ${targetFurn.type.toUpperCase()}!`;
          if (targetFurn.type === 'vacuum') possessLabel = "🌀 VACUUM POSSESSED!";
          else if (targetFurn.type === 'mop_bucket') possessLabel = "🧹 MOP POSSESSED!";
          else if (targetFurn.type === 'candle' || targetFurn.type === 'fire_poker') possessLabel = "🔥 FIRE TOOL (BURNS WEBS)!";
          else if (targetFurn.type === 'tv') {
            possessLabel = "📺 TV POSSESSED (LURE ON)!";
            triggerDistractionWave(targetFurn.x, targetFurn.y, 'tv');
          } else if (targetFurn.type === 'clock') {
            possessLabel = "⏰ CLOCK POSSESSED (ALARM)!";
            triggerDistractionWave(targetFurn.x, targetFurn.y, 'clock');
          }

          floatingTexts.push({ text: possessLabel, x: player.x, y: player.y - 14, life: 1.1, color: "#39ff14" });
        } else {
          floatingTexts.push({ text: "GET NEAR AN OBJECT!", x: player.x, y: player.y - 14, life: 0.6, color: "#f6c90e" });
        }
      }

      updateUI();
    }

    /* ==========================================================================
       NPC VISION CONE & STEALTH DETECTION
       ========================================================================== */
    function isPlayerSpottedByAnyNPC() {
      // Completely hidden inside stationary non-mobile furniture
      if (player.isPossessing && player.possessedFurniture && !player.possessedFurniture.isMobileTool) {
        return false;
      }

      for (const npc of npcs) {
        if (npc.state === 'slipped') continue;

        const dx = player.x - npc.x;
        const dy = player.y - npc.y;
        const dist = Math.hypot(dx, dy);

        // 1. Paranormal Investigator EMF Radar Check (Detects unpossessed ghost nearby)
        if (npc.type === 'investigator' && !player.isPossessing && dist <= 130) {
          audio.playEMFBeep();
          npc.speechText = "🚨 EMF DETECTED!";
          npc.speechTimer = 1.8;
          return true;
        }

        // 2. Vacuum Noise (Unless using silent spectral broom upgrade)
        if (player.isPossessing && player.possessedFurniture?.type === 'vacuum' && player.isMoving && dist <= 140) {
          if (!upgrades.spectral_broom.owned) {
            npc.speechText = "❓ WHAT'S THAT VACUUM MOTOR?!";
            npc.speechTimer = 1.8;
            return true;
          }
        }

        // 3. Line-of-sight vision cone
        if (dist <= npc.visionLength) {
          const npcAngle = npc.visionAngleFacing;
          const angleToPlayer = Math.atan2(dy, dx);
          
          let diff = angleToPlayer - npcAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          if (Math.abs(diff) <= npc.visionAngle) {
            return true;
          }
        }
      }
      return false;
    }

    /* ==========================================================================
       PARTICLES & VISUAL JUICINESS
       ========================================================================== */
    function triggerScreenShake(intensity = 6, duration = 0.22) {
      shakeIntensity = intensity;
      shakeDuration = duration;
    }

    function spawnPoofParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.4;
        const speed = 30 + Math.random() * 60;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2.5 + Math.random() * 3.5,
          color: color,
          life: 0.4 + Math.random() * 0.3,
          maxLife: 0.7
        });
      }
    }

    function spawnFlameParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 35 + Math.random() * 60;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 20,
          size: 3 + Math.random() * 3,
          color: Math.random() > 0.4 ? '#ff5500' : '#f6c90e',
          life: 0.35 + Math.random() * 0.3,
          maxLife: 0.65
        });
      }
    }

    function spawnRoomCleanseSparkles(room) {
      const midX = ((room.x1 + room.x2) / 2 + 0.5) * TILE_SIZE;
      const midY = ((room.y1 + room.y2) / 2 + 0.5) * TILE_SIZE;

      for (let i = 0; i < 40; i++) {
        const rx = (room.x1 + Math.random() * (room.x2 - room.x1)) * TILE_SIZE;
        const ry = (room.y1 + Math.random() * (room.y2 - room.y1)) * TILE_SIZE;
        particles.push({
          x: rx, y: ry,
          vx: (Math.random() - 0.5) * 40,
          vy: -30 - Math.random() * 50,
          size: 3.5 + Math.random() * 3,
          color: Math.random() > 0.5 ? '#f6c90e' : '#00f0ff',
          life: 0.8 + Math.random() * 0.5,
          maxLife: 1.3
        });
      }

      floatingTexts.push({
        text: `⭐ ${room.name.toUpperCase()} 100% SPOTLESS! ⭐`,
        x: midX,
        y: midY - 24,
        life: 1.8,
        color: '#f6c90e'
      });
    }

    /* Check if an individual room reached 100% cleanliness */
    function checkRoomCleanlinessCelebration() {
      currentLevel.rooms.forEach(room => {
        if (cleanedRoomsSet.has(room.name)) return;

        const slimesInRoom = slimes.filter(s => {
          const gx = Math.floor(s.x / TILE_SIZE);
          const gy = Math.floor(s.y / TILE_SIZE);
          return gx >= room.x1 && gx <= room.x2 && gy >= room.y1 && gy <= room.y2;
        });

        const websInRoom = cobwebs.filter(w => {
          const gx = Math.floor(w.x / TILE_SIZE);
          const gy = Math.floor(w.y / TILE_SIZE);
          return gx >= room.x1 && gx <= room.x2 && gy >= room.y1 && gy <= room.y2;
        });

        if (slimesInRoom.length === 0 && websInRoom.length === 0) {
          cleanedRoomsSet.add(room.name);
          playerPoints += 3; // Bonus points for pristine room
          audio.playRoomCleanedChime();
          triggerScreenShake(5, 0.25);
          spawnRoomCleanseSparkles(room);
        }
      });
    }

    /* ==========================================================================
       MAIN GAME LOOP & UPDATE
       ========================================================================== */
    let lastTimestamp = performance.now();

    function update(dt) {
      gameTime += dt;

      if (shakeDuration > 0) {
        shakeDuration -= dt;
        if (shakeDuration <= 0) shakeIntensity = 0;
      }

      if (busted || levelCleared) return;

      // Time Attack Countdown (Floor 3 Grand Ballroom)
      if (currentLevel.isTimeAttack) {
        timeRemaining -= dt;
        if (timeRemaining <= 0) {
          timeRemaining = 0;
          busted = true;
          audio.playBusted();
          triggerScreenShake(14, 0.6);
        }
      }

      // Update Squeaky Decoy Traps
      for (let i = traps.length - 1; i >= 0; i--) {
        const trap = traps[i];
        trap.life -= dt;
        if (gameTime - trap.lastSqueak > trap.squeakInterval) {
          trap.lastSqueak = gameTime;
          audio.playSqueak();
          triggerDistractionWave(trap.x, trap.y, 'trap');
        }
        if (trap.life <= 0) traps.splice(i, 1);
      }

      // 1. UPDATE NPCS
      npcs.forEach(npc => {
        if (npc.speechTimer > 0) npc.speechTimer -= dt;

        if (npc.state === 'slipped') {
          npc.slipTimer -= dt;
          if (npc.slipTimer <= 0) {
            npc.state = 'patrolling';
            pickNextNPCDestination(npc);
          }
          return;
        }

        // Messy Kid drops mess
        if (npc.type === 'messy_kid') {
          npc.messTimer -= dt;
          if (npc.messTimer <= 0) {
            npc.messTimer = 7 + Math.random() * 5;
            slimes.push({
              id: Date.now() + Math.random(),
              type: 'green',
              category: 'standard_dust',
              points: 1,
              x: npc.x,
              y: npc.y,
              radius: 10,
              color: '#39ff14',
              bubblePhase: Math.random() * Math.PI * 2,
              bubbleSpeed: 3
            });
            spawnPoofParticles(npc.x, npc.y, '#39ff14');
            npc.speechText = "🍪 DROPPED SNACKS!";
            npc.speechTimer = 2.4;
          }
        }

        // Slipped on wet mop trail check
        for (let i = wetTrails.length - 1; i >= 0; i--) {
          const trail = wetTrails[i];
          if (Math.hypot(npc.x - trail.x, npc.y - trail.y) < npc.radius + trail.radius) {
            npc.state = 'slipped';
            npc.slipTimer = 2.4;
            npc.speechText = "💫 WHOA! *SLIPPED!*";
            npc.speechTimer = 2.4;
            audio.playSlip();
            triggerScreenShake(5, 0.2);
            spawnPoofParticles(npc.x, npc.y, '#00f0ff');
            wetTrails.splice(i, 1);
            break;
          }
        }

        if (npc.state === 'slipped') return;

        // Patrol & Distraction navigation
        if (npc.state === 'patrolling' || npc.state === 'distracted') {
          if (npc.currentPath && npc.pathIndex < npc.currentPath.length) {
            const nextStep = npc.currentPath[npc.pathIndex];
            const targetX = (nextStep.x + 0.5) * TILE_SIZE;
            const targetY = (nextStep.y + 0.5) * TILE_SIZE;
            const dx = targetX - npc.x;
            const dy = targetY - npc.y;
            const dist = Math.hypot(dx, dy);

            npc.direction = nextStep.dir;
            npc.targetVisionAngle = getAngleForDirection(nextStep.dir);

            const speed = npc.state === 'distracted' ? npc.speed * 1.25 : npc.speed;
            const stepDist = speed * dt;
            if (dist <= stepDist) {
              npc.x = targetX;
              npc.y = targetY;
              npc.pathIndex++;
            } else {
              npc.x += (dx / dist) * stepDist;
              npc.y += (dy / dist) * stepDist;
            }
            npc.walkFrame += dt * 8;
          } else {
            npc.state = 'inspecting';
            npc.inspectTimer = 1.4 + Math.random() * 1.2;
            npc.inspectPhase = 0;
          }
        } else if (npc.state === 'inspecting') {
          npc.inspectTimer -= dt;
          npc.inspectPhase += dt * 3.2;
          const baseAngle = getAngleForDirection(npc.direction);
          npc.targetVisionAngle = baseAngle + Math.sin(npc.inspectPhase) * 0.9;
          if (npc.inspectTimer <= 0) pickNextNPCDestination(npc);
        }

        let angleDiff = npc.targetVisionAngle - npc.visionAngleFacing;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        npc.visionAngleFacing += angleDiff * Math.min(1, 10 * dt);
      });

      // 2. CHECK STEALTH & PANIC
      const spotted = isPlayerSpottedByAnyNPC();
      if (spotted) {
        panicMeter += 70 * dt;
        audio.playPanicAlert();
        triggerScreenShake(3.5, 0.1);

        if (panicMeter >= 100) {
          panicMeter = 100;
          busted = true;
          audio.playBusted();
          triggerScreenShake(14, 0.6);
        }
      } else {
        if (panicMeter > 0) {
          const coolRate = (player.isPossessing && !player.possessedFurniture?.isMobileTool) ? 50 : 25;
          panicMeter = Math.max(0, panicMeter - coolRate * dt);
        }
      }

      // 3. PLAYER MOVEMENT & HAZARD INTERACTIONS
      let moveX = 0;
      let moveY = 0;
      if (inputVector.active) {
        moveX = inputVector.x;
        moveY = inputVector.y;
      } else {
        if (keyboardKeys.up) moveY -= 1;
        if (keyboardKeys.down) moveY += 1;
        if (keyboardKeys.left) moveX -= 1;
        if (keyboardKeys.right) moveX += 1;
      }

      const inputLength = Math.hypot(moveX, moveY);
      player.isMoving = (inputLength > 0.05);

      const isMobileTool = player.isPossessing && player.possessedFurniture?.isMobileTool;
      const isStationaryFurn = player.isPossessing && !player.possessedFurniture?.isMobileTool;

      if (isStationaryFurn) {
        if (player.possessedFurniture) {
          player.x = player.possessedFurniture.x;
          player.y = player.possessedFurniture.y;
        }
        player.mopAngle = 0;
      } else {
        let currentSpeed = player.baseSpeed;

        // Environmental Hazard: Flooded Water Tile slows speed by 40% (unless valve turned off)
        const curTileX = Math.floor(player.x / TILE_SIZE);
        const curTileY = Math.floor(player.y / TILE_SIZE);
        if (levelMap[curTileY] && levelMap[curTileY][curTileX] === TILE.FLOODED && (!pipeValveObj || !pipeValveObj.turnedOff)) {
          currentSpeed *= 0.60;
        }

        // Environmental Hazard: Creaky Floorboards alert guards if walked over without Spectral Broom
        if (levelMap[curTileY] && levelMap[curTileY][curTileX] === TILE.CREAKY_PLANK && player.isMoving) {
          if (!upgrades.spectral_broom.owned) {
            audio.playCreak();
            panicMeter = Math.min(100, panicMeter + 18 * dt);
            npcs.forEach(npc => {
              if (Math.hypot(npc.x - player.x, npc.y - player.y) < 160) {
                npc.speechText = "👀 HEARD A CREAK!";
                npc.speechTimer = 1.6;
              }
            });
          }
        }

        if (player.isPossessing && player.possessedFurniture?.type === 'mop_bucket') {
          currentSpeed *= 1.15;
        }

        if (player.isMoving) {
          const normX = (moveX / (inputLength > 1 ? inputLength : 1)) * currentSpeed * dt;
          const normY = (moveY / (inputLength > 1 ? inputLength : 1)) * currentSpeed * dt;

          if (Math.abs(moveX) > Math.abs(moveY)) {
            player.direction = moveX > 0 ? 'right' : 'left';
          } else {
            player.direction = moveY > 0 ? 'down' : 'up';
          }

          const targetX = player.x + normX;
          if (!checkWallCollision(targetX, player.y, player.radius)) {
            player.x = targetX;
          } else if (gameTime - player.lastBumpSound > 0.25) {
            audio.playBump();
            player.lastBumpSound = gameTime;
          }

          const targetY = player.y + normY;
          if (!checkWallCollision(player.x, targetY, player.radius)) {
            player.y = targetY;
          } else if (gameTime - player.lastBumpSound > 0.25) {
            audio.playBump();
            player.lastBumpSound = gameTime;
          }

          player.mopAngle = Math.sin(gameTime * 14) * 0.4;

          if (player.isPossessing && player.possessedFurniture?.type === 'vacuum') {
            audio.playVacuumHum();
          }

          if (player.isPossessing && player.possessedFurniture?.type === 'mop_bucket') {
            if (gameTime - player.lastTrailSpawn > 0.18) {
              player.lastTrailSpawn = gameTime;
              wetTrails.push({ x: player.x, y: player.y, radius: 12, life: 7.0, maxLife: 7.0 });
            }
          }

          if (player.isPossessing && player.possessedFurniture) {
            player.possessedFurniture.x = player.x;
            player.possessedFurniture.y = player.y;
          }
        } else {
          player.mopAngle = 0;
        }
      }

      // Nearest furniture
      closestFurniture = null;
      if (!player.isPossessing) {
        let minDist = 60;
        furnitureList.forEach(furn => {
          const d = Math.hypot(player.x - furn.x, player.y - furn.y);
          if (d < minDist) {
            closestFurniture = furn;
            minDist = d;
          }
        });
      }

      player.floatOffset = Math.sin(gameTime * 4) * 3;
      player.tailFrame = Math.floor((gameTime * 8) % 4);

      // 4. CLEANING MESSES & HAZARDS
      // Clean radius & tool checks
      let cleanRadius = player.radius + 12;
      const isVacuum = player.isPossessing && player.possessedFurniture?.type === 'vacuum';
      const isMop = player.isPossessing && player.possessedFurniture?.type === 'mop_bucket';
      const isFireTool = player.isPossessing && (player.possessedFurniture?.type === 'candle' || player.possessedFurniture?.type === 'fire_poker');

      if (isVacuum) cleanRadius = upgrades.ghost_vacuum.owned ? 85 : 55;
      else if (isMop) cleanRadius = 32;

      // Clean Standard Dust & Ectoplasm
      if (!isStationaryFurn) {
        for (let i = slimes.length - 1; i >= 0; i--) {
          const slime = slimes[i];
          const dist = Math.hypot(player.x - slime.x, player.y - slime.y);

          if (dist < cleanRadius + slime.radius) {
            // Ectoplasmic Slime requirement: Can only be cleaned with possessed gear or vacuum upgrade
            if (slime.category === 'ecto_slime' && !player.isPossessing && !upgrades.ghost_vacuum.owned) {
              if (Math.random() < 0.05) {
                floatingTexts.push({ text: "NEED CLEANING GEAR! 🌀🧹", x: slime.x, y: slime.y - 14, life: 0.8, color: "#f72585" });
              }
              continue;
            }

            const pts = slime.points * (upgrades.poltergeist_polish.owned && player.isPossessing ? 2 : 1);
            score += pts;
            playerPoints += pts;

            spawnPoofParticles(slime.x, slime.y, slime.color);
            audio.playSlimeClean();
            slimes.splice(i, 1);
            checkRoomCleanlinessCelebration();

            if (score >= totalTargetScore && !levelCleared) {
              levelCleared = true;
              audio.playVictory();
              triggerScreenShake(10, 0.4);
            }
          }
        }

        // Clean Haunted Cobwebs (Require Fire Tool)
        for (let i = cobwebs.length - 1; i >= 0; i--) {
          const web = cobwebs[i];
          const dist = Math.hypot(player.x - web.x, player.y - web.y);

          if (dist < cleanRadius + web.radius) {
            if (!isFireTool) {
              if (Math.random() < 0.05) {
                floatingTexts.push({ text: "NEEDS FIRE / CANDLE! 🕯️🔥", x: web.x, y: web.y - 14, life: 0.8, color: "#ffaa00" });
              }
              continue;
            }

            const pts = web.points;
            score += pts;
            playerPoints += pts;
            audio.playBurn();
            spawnFlameParticles(web.x, web.y);
            cobwebs.splice(i, 1);
            checkRoomCleanlinessCelebration();

            if (score >= totalTargetScore && !levelCleared) {
              levelCleared = true;
              audio.playVictory();
              triggerScreenShake(10, 0.4);
            }
          }
        }
      }

      // Camera Tracking
      const mapPixelWidth = currentLevel.cols * TILE_SIZE;
      const mapPixelHeight = currentLevel.rows * TILE_SIZE;
      camera.targetX = Math.max(0, Math.min(player.x - CANVAS_VIEWPORT_SIZE / 2, mapPixelWidth - CANVAS_VIEWPORT_SIZE));
      camera.targetY = Math.max(0, Math.min(player.y - CANVAS_VIEWPORT_SIZE / 2, mapPixelHeight - CANVAS_VIEWPORT_SIZE));
      camera.x += (camera.targetX - camera.x) * Math.min(1, 10 * dt);
      camera.y += (camera.targetY - camera.y) * Math.min(1, 10 * dt);

      // Update Wet Trails & Waves
      for (let i = wetTrails.length - 1; i >= 0; i--) {
        const wt = wetTrails[i];
        wt.life -= dt;
        if (wt.life <= 0) wetTrails.splice(i, 1);
      }

      for (let i = lureWaves.length - 1; i >= 0; i--) {
        const lw = lureWaves[i];
        lw.radius += 160 * dt;
        lw.life -= dt;
        if (lw.life <= 0 || lw.radius > lw.maxRadius) lureWaves.splice(i, 1);
      }

      // Particles & Floating Texts
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 24 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      updateUI();
    }

    /* ==========================================================================
       RENDER SYSTEM
       ========================================================================== */
    function drawMap() {
      const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
      const endCol = Math.min(currentLevel.cols - 1, Math.ceil((camera.x + CANVAS_VIEWPORT_SIZE) / TILE_SIZE));
      const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
      const endRow = Math.min(currentLevel.rows - 1, Math.ceil((camera.y + CANVAS_VIEWPORT_SIZE) / TILE_SIZE));

      for (let y = startRow; y <= endRow; y++) {
        for (let x = startCol; x <= endCol; x++) {
          const tile = levelMap[y][x];
          const px = Math.floor(x * TILE_SIZE - camera.x);
          const py = Math.floor(y * TILE_SIZE - camera.y);

          if (tile === TILE.WALL) {
            ctx.fillStyle = '#261447';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#160b29';
            ctx.fillRect(px, py, TILE_SIZE, 2);
            ctx.fillRect(px, py + 16, TILE_SIZE, 2);
            ctx.fillStyle = '#3f256e';
            ctx.fillRect(px + 2, py + 2, 12, 12);
          } else if (tile === TILE.FLOODED && (!pipeValveObj || !pipeValveObj.turnedOff)) {
            ctx.fillStyle = '#0f2b48';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#0077b6';
            ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            const rip = Math.sin(gameTime * 4 + x) * 2;
            ctx.fillRect(px + 6, py + 14 + rip, 14, 2);
          } else if (tile === TILE.CREAKY_PLANK) {
            ctx.fillStyle = '#3a2012';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#5c3317';
            ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.fillStyle = '#221208';
            ctx.fillRect(px, py + 10, TILE_SIZE, 2);
            ctx.fillRect(px, py + 22, TILE_SIZE, 2);
            ctx.fillStyle = '#f6c90e';
            ctx.fillRect(px + 4, py + 5, 2, 2);
            ctx.fillRect(px + 26, py + 16, 2, 2);
          } else {
            const isAlt = (x + y) % 2 === 0;
            ctx.fillStyle = isAlt ? '#130d24' : '#19112e';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = isAlt ? '#1a1230' : '#1f1538';
            ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
          }
        }
      }

      // Draw Pipe Valve in Flooded Basement
      if (pipeValveObj) {
        const vx = pipeValveObj.x - camera.x;
        const vy = pipeValveObj.y - camera.y;
        if (vx >= -30 && vx <= CANVAS_VIEWPORT_SIZE + 30 && vy >= -30 && vy <= CANVAS_VIEWPORT_SIZE + 30) {
          ctx.save();
          ctx.fillStyle = pipeValveObj.turnedOff ? '#39ff14' : '#ff0055';
          ctx.beginPath();
          ctx.arc(vx, vy, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#222';
          ctx.fillRect(vx - 2, vy - 14, 4, 28);
          ctx.fillRect(vx - 14, vy - 2, 28, 4);

          ctx.font = '6px "Press Start 2P", monospace';
          ctx.fillStyle = pipeValveObj.turnedOff ? '#39ff14' : '#ff0055';
          ctx.textAlign = 'center';
          ctx.fillText(pipeValveObj.turnedOff ? "VALVE CLOSED" : "[TURN VALVE]", vx, vy - 18);
          ctx.restore();
        }
      }

      // Draw Room Labels on Ground
      currentLevel.rooms.forEach(room => {
        const rx = ((room.x1 + room.x2) / 2 + 0.5) * TILE_SIZE - camera.x;
        const ry = (room.y1 + 1.2) * TILE_SIZE - camera.y;
        if (rx >= -100 && rx <= CANVAS_VIEWPORT_SIZE + 100 && ry >= -50 && ry <= CANVAS_VIEWPORT_SIZE + 50) {
          ctx.save();
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = cleanedRoomsSet.has(room.name) ? 'rgba(57, 255, 20, 0.65)' : 'rgba(157, 78, 221, 0.35)';
          ctx.textAlign = 'center';
          ctx.fillText((cleanedRoomsSet.has(room.name) ? "✨ " : "") + room.name.toUpperCase(), Math.floor(rx), Math.floor(ry));
          ctx.restore();
        }
      });
    }

    function drawWetTrails() {
      wetTrails.forEach(wt => {
        const wx = wt.x - camera.x;
        const wy = wt.y - camera.y;
        if (wx < -30 || wx > CANVAS_VIEWPORT_SIZE + 30 || wy < -30 || wy > CANVAS_VIEWPORT_SIZE + 30) return;
        const alpha = Math.max(0, wt.life / wt.maxLife);
        ctx.save();
        ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.4})`;
        ctx.beginPath();
        ctx.ellipse(wx, wy, wt.radius, wt.radius * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawLureWaves() {
      lureWaves.forEach(lw => {
        const lx = lw.x - camera.x;
        const ly = lw.y - camera.y;
        if (lx < -300 || lx > CANVAS_VIEWPORT_SIZE + 300 || ly < -300 || ly > CANVAS_VIEWPORT_SIZE + 300) return;
        const alpha = Math.max(0, lw.life / 1.6);
        ctx.save();
        ctx.strokeStyle = lw.type === 'clock' ? `rgba(246, 201, 14, ${alpha})` : (lw.type === 'trap' ? `rgba(255, 170, 0, ${alpha})` : `rgba(0, 240, 255, ${alpha})`);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(lx, ly, lw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawTraps() {
      traps.forEach(trap => {
        const tx = trap.x - camera.x;
        const ty = trap.y - camera.y;
        if (tx < -30 || tx > CANVAS_VIEWPORT_SIZE + 30 || ty < -30 || ty > CANVAS_VIEWPORT_SIZE + 30) return;
        ctx.save();
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(tx - 7, ty - 4, 14, 8);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(tx - 5, ty - 2, 10, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(tx - 6, ty + 2, 12, 2);
        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillStyle = '#f6c90e';
        ctx.textAlign = 'center';
        ctx.fillText("SQUEAK! 👟", tx, ty - 8);
        ctx.restore();
      });
    }

    function drawSlimes() {
      slimes.forEach(slime => {
        const sx = slime.x - camera.x;
        const sy = slime.y - camera.y;
        if (sx < -30 || sx > CANVAS_VIEWPORT_SIZE + 30 || sy < -30 || sy > CANVAS_VIEWPORT_SIZE + 30) return;

        const pulse = Math.sin(gameTime * slime.bubbleSpeed + slime.bubblePhase) * 1.6;
        const r = slime.radius + pulse;

        if (slime.category === 'ecto_slime') {
          ctx.fillStyle = 'rgba(247, 37, 133, 0.35)';
          ctx.beginPath();
          ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#7209b7';
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f72585';
          ctx.beginPath();
          ctx.arc(sx - 1, sy - 1, r * 0.7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 3, 3);
          ctx.fillRect(Math.floor(sx + 3), Math.floor(sy + 2), 2, 2);
        } else {
          ctx.fillStyle = slime.type === 'cyan' ? 'rgba(0, 240, 255, 0.25)' : 'rgba(57, 255, 20, 0.22)';
          ctx.beginPath();
          ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = slime.color;
          ctx.beginPath();
          ctx.arc(sx, sy, r * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawCobwebs() {
      cobwebs.forEach(web => {
        const wx = web.x - camera.x;
        const wy = web.y - camera.y;
        if (wx < -30 || wx > CANVAS_VIEWPORT_SIZE + 30 || wy < -30 || wy > CANVAS_VIEWPORT_SIZE + 30) return;

        ctx.save();
        ctx.strokeStyle = 'rgba(230, 240, 255, 0.85)';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          ctx.moveTo(wx, wy);
          ctx.lineTo(wx + Math.cos(a) * web.radius, wy + Math.sin(a) * web.radius);
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(wx, wy, web.radius * 0.5, 0, Math.PI * 2);
        ctx.arc(wx, wy, web.radius * 0.85, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(wx - 2, wy - 2, 4, 4);
        ctx.restore();
      });
    }

    function drawFurnitureItem(furn) {
      const x = furn.x - camera.x;
      const y = furn.y - camera.y;
      if (x < -50 || x > CANVAS_VIEWPORT_SIZE + 50 || y < -50 || y > CANVAS_VIEWPORT_SIZE + 50) return;

      if (furn === closestFurniture && !player.isPossessing) {
        ctx.save();
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(x - 18, y - 18, 36, 36);
        ctx.setLineDash([]);

        const bob = Math.sin(gameTime * 6) * 3;
        ctx.fillStyle = 'rgba(10, 5, 24, 0.9)';
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 1;
        ctx.fillRect(x - 36, y - 28 + bob, 72, 12);
        ctx.strokeRect(x - 36, y - 28 + bob, 72, 12);

        let label = '[POSSESS]';
        if (furn.type === 'vacuum') label = '[VACUUM]';
        if (furn.type === 'mop_bucket') label = '[MOP]';
        if (furn.type === 'candle' || furn.type === 'fire_poker') label = '[FIRE TOOL]';
        if (furn.type === 'tv') label = '[LURE TV]';
        if (furn.type === 'clock') label = '[ALARM]';

        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillStyle = '#39ff14';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y - 20 + bob);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(Math.floor(x), Math.floor(y));

      if (furn.isPossessed) {
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(57, 255, 20, 0.25)';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();
      }

      switch (furn.type) {
        case 'vacuum':
          ctx.fillStyle = '#c0392b';
          ctx.fillRect(-8, -6, 16, 12);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(-6, -4, 12, 8);
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(-2, 6, 4, 8);
          ctx.fillStyle = '#34495e';
          ctx.fillRect(-6, 12, 12, 4);
          ctx.fillStyle = '#2c3e50';
          ctx.fillRect(-9, -2, 3, 6);
          ctx.fillRect(6, -2, 3, 6);
          break;

        case 'mop_bucket':
          ctx.fillStyle = '#f39c12';
          ctx.fillRect(-9, -4, 18, 12);
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(-7, -2, 14, 8);
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(-6, 0, 12, 3);
          ctx.fillStyle = '#d4a373';
          ctx.fillRect(3, -14, 3, 14);
          ctx.fillStyle = '#ecf0f1';
          ctx.fillRect(0, -16, 9, 4);
          break;

        case 'candle':
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(-4, 0, 8, 10);
          ctx.fillStyle = '#ecf0f1';
          ctx.fillRect(-2, -8, 4, 8);
          ctx.fillStyle = '#ff5500';
          ctx.beginPath();
          ctx.arc(0, -12, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffea00';
          ctx.beginPath();
          ctx.arc(0, -12, 2, 0, Math.PI * 2);
          ctx.fill();
          break;

        case 'fire_poker':
          ctx.fillStyle = '#555';
          ctx.fillRect(-2, -14, 4, 28);
          ctx.fillStyle = '#ff5500';
          ctx.fillRect(-4, 10, 8, 4);
          break;

        case 'tv':
          ctx.fillStyle = '#4a2810';
          ctx.fillRect(-12, -10, 24, 20);
          ctx.fillStyle = furn.isPossessed ? '#00f0ff' : '#1a252f';
          ctx.fillRect(-9, -7, 14, 14);
          break;

        case 'clock':
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(-8, -14, 16, 28);
          ctx.fillStyle = '#fff8e1';
          ctx.beginPath();
          ctx.arc(0, -7, 6, 0, Math.PI * 2);
          ctx.fill();
          break;

        default:
          ctx.fillStyle = '#5c3a21';
          ctx.fillRect(-12, -8, 24, 16);
          break;
      }

      if (furn.isPossessed) {
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-4, -4, 3, 3);
        ctx.fillRect(2, -4, 3, 3);
      }

      ctx.restore();
    }

    function drawGhostJanitor() {
      if (player.isPossessing) return;

      const drawX = Math.floor(player.x - camera.x);
      const drawY = Math.floor(player.y + player.floatOffset - camera.y);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 240, 255, 0.18)';
      ctx.beginPath();
      ctx.arc(drawX, drawY, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d8f3dc';
      ctx.beginPath();
      ctx.arc(drawX, drawY - 2, 9, Math.PI, 0, false);
      ctx.lineTo(drawX + 9, drawY + 6);

      const tFrame = player.tailFrame;
      ctx.lineTo(drawX + 5, drawY + 8 + (tFrame === 0 ? 2 : 0));
      ctx.lineTo(drawX + 1, drawY + 5);
      ctx.lineTo(drawX - 3, drawY + 8 + (tFrame === 2 ? 2 : 0));
      ctx.lineTo(drawX - 9, drawY + 6);
      ctx.closePath();
      ctx.fill();

      // Janitor Cap
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(drawX - 6, drawY - 10, 12, 3);
      ctx.fillRect(drawX - 4, drawY - 13, 8, 3);
      ctx.fillStyle = '#222';
      ctx.fillRect(drawX + (player.direction === 'left' ? -7 : 1), drawY - 10, 6, 1.5);

      // Ghost Eyes
      let eyeOffsetX = player.direction === 'left' ? -2 : (player.direction === 'right' ? 2 : 0);
      let eyeOffsetY = player.direction === 'up' ? -2 : (player.direction === 'down' ? 1 : 0);
      ctx.fillStyle = '#0a0818';
      ctx.fillRect(drawX - 5 + eyeOffsetX, drawY - 3 + eyeOffsetY, 2.5, 3);
      ctx.fillRect(drawX + 2 + eyeOffsetX, drawY - 3 + eyeOffsetY, 2.5, 3);

      // Mop
      ctx.save();
      ctx.translate(drawX + 7, drawY + 2);
      ctx.rotate(player.mopAngle);
      ctx.strokeStyle = '#d4a373';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-2, -10);
      ctx.lineTo(4, 10);
      ctx.stroke();
      ctx.fillStyle = '#ced4da';
      ctx.fillRect(2, 8, 6, 5);
      ctx.restore();

      ctx.restore();
    }

    function drawPatrollingNPC(npc) {
      const hx = Math.floor(npc.x - camera.x);
      const hy = Math.floor(npc.y - camera.y);

      if (hx < -180 || hx > CANVAS_VIEWPORT_SIZE + 180 || hy < -180 || hy > CANVAS_VIEWPORT_SIZE + 180) return;

      if (npc.state !== 'slipped') {
        ctx.save();
        const vFacing = npc.visionAngleFacing;
        const vAngle = npc.visionAngle;
        const vLen = npc.visionLength;

        const leftAngle = vFacing - vAngle;
        const rightAngle = vFacing + vAngle;

        const coneGrad = ctx.createRadialGradient(hx, hy, 4, hx, hy, vLen);
        coneGrad.addColorStop(0, 'rgba(255, 240, 150, 0.48)');
        coneGrad.addColorStop(0.7, 'rgba(255, 230, 100, 0.22)');
        coneGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');

        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.arc(hx, hy, vLen, leftAngle, rightAngle);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(hx, hy);

      if (npc.state === 'slipped') {
        ctx.rotate(Math.sin(gameTime * 18) * 0.6 + Math.PI / 3);
      }

      const legBob = Math.sin(npc.walkFrame) * 2.5;

      if (npc.type === 'messy_kid') {
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(-5, 4 + (legBob > 0 ? legBob : 0), 4, 5);
        ctx.fillRect(1, 4 + (legBob < 0 ? -legBob : 0), 4, 5);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-6, -4, 12, 8);
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(0, -8, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (npc.type === 'investigator') {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-5, 4 + (legBob > 0 ? legBob : 0), 4, 7);
        ctx.fillRect(1, 4 + (legBob < 0 ? -legBob : 0), 4, 7);
        ctx.fillStyle = '#34495e';
        ctx.fillRect(-7, -5, 14, 10);
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-5, -11, 10, 3);
      } else {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-5, 4 + (legBob > 0 ? legBob : 0), 4, 7);
        ctx.fillRect(1, 4 + (legBob < 0 ? -legBob : 0), 4, 7);
        ctx.fillStyle = '#8e44ad';
        ctx.fillRect(-7, -5, 14, 10);
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(0, -9, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // ENHANCED LARGER READABLE POP-UP MESSAGES
      if (npc.speechTimer > 0 && npc.speechText) {
        ctx.save();
        ctx.font = '8.5px "Press Start 2P", monospace';
        
        const textMetrics = ctx.measureText(npc.speechText);
        const boxW = Math.max(80, textMetrics.width + 16);
        const boxH = 18;
        const boxY = -38;

        ctx.fillStyle = 'rgba(13, 8, 24, 0.95)';
        ctx.strokeStyle = '#f6c90e';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 6;

        ctx.fillRect(-boxW / 2, boxY, boxW, boxH);
        ctx.strokeRect(-boxW / 2, boxY, boxW, boxH);

        ctx.fillStyle = 'rgba(13, 8, 24, 0.95)';
        ctx.beginPath();
        ctx.moveTo(-4, boxY + boxH);
        ctx.lineTo(0, boxY + boxH + 5);
        ctx.lineTo(4, boxY + boxH);
        ctx.fill();

        ctx.fillStyle = '#f6c90e';
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(npc.speechText, 0, boxY + boxH / 2 + 1);
        ctx.restore();
      }

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        const px = p.x - camera.x;
        const py = p.y - camera.y;
        if (px < -10 || px > CANVAS_VIEWPORT_SIZE + 10 || py < -10 || py > CANVAS_VIEWPORT_SIZE + 10) return;
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(Math.floor(px - p.size / 2), Math.floor(py - p.size / 2), Math.floor(p.size), Math.floor(p.size));
      });
      ctx.globalAlpha = 1.0;
    }

    function drawFloatingTexts() {
      floatingTexts.forEach(ft => {
        const fx = ft.x - camera.x;
        const fy = ft.y - camera.y;
        ctx.save();
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = ft.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, Math.floor(fx), Math.floor(fy));
        ctx.restore();
      });
    }

    /* "BEFORE & AFTER" FLOOR SUMMARY & OVERLAYS */
    function drawOverlays() {
      if (busted) {
        ctx.fillStyle = 'rgba(25, 0, 10, 0.92)';
        ctx.fillRect(0, 0, CANVAS_VIEWPORT_SIZE, CANVAS_VIEWPORT_SIZE);
        ctx.textAlign = 'center';

        const pulse = 1 + Math.sin(gameTime * 6) * 0.06;
        ctx.save();
        ctx.translate(CANVAS_VIEWPORT_SIZE / 2, 160);
        ctx.scale(pulse, pulse);
        ctx.font = '22px "Press Start 2P", monospace';
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 14;
        ctx.fillText('BUSTED!', 0, 0);
        ctx.restore();

        ctx.font = '9px "Press Start 2P", monospace';
        ctx.fillStyle = '#f6c90e';
        ctx.fillText('THE RESIDENTS SPOTTED YOU!', CANVAS_VIEWPORT_SIZE / 2, 210);

        ctx.fillStyle = '#00f0ff';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText(`FLOOR CLEANED: ${score} / ${totalTargetScore}`, CANVAS_VIEWPORT_SIZE / 2, 260);

        const blink = Math.floor(gameTime * 2.5) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#ffffff';
          ctx.font = '9px "Press Start 2P", monospace';
          ctx.fillText('TAP [START] / [POSSESS] TO RETRY', CANVAS_VIEWPORT_SIZE / 2, 335);
        }
        return;
      }

      if (levelCleared) {
        victoryTimer += 0.016;
        ctx.fillStyle = 'rgba(10, 5, 24, 0.95)';
        ctx.fillRect(0, 0, CANVAS_VIEWPORT_SIZE, CANVAS_VIEWPORT_SIZE);

        ctx.textAlign = 'center';
        ctx.font = '16px "Press Start 2P", monospace';
        ctx.fillStyle = '#f6c90e';
        ctx.shadowColor = '#f6c90e';
        ctx.shadowBlur = 12;
        ctx.fillText('FLOOR CLEANSED! ✨', CANVAS_VIEWPORT_SIZE / 2, 60);
        ctx.shadowBlur = 0;

        const boxX = 60;
        const boxY = 90;
        const boxW = 392;
        const boxH = 140;

        ctx.fillStyle = '#140c26';
        ctx.strokeStyle = '#9d4edd';
        ctx.lineWidth = 2;
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        const sweepProgress = (Math.sin(victoryTimer * 2) + 1) / 2;
        const splitX = boxX + boxW * sweepProgress;

        ctx.save();
        ctx.beginPath();
        ctx.rect(boxX, boxY, boxW * sweepProgress, boxH);
        ctx.clip();
        ctx.fillStyle = '#221122';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.fillStyle = '#ff0055';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.fillText('⚡ BEFORE: FILTHY', boxX + 80, boxY + 20);
        ctx.fillStyle = '#7209b7';
        ctx.beginPath();
        ctx.arc(boxX + 50, boxY + 70, 24, 0, Math.PI * 2);
        ctx.arc(boxX + 120, boxY + 100, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(splitX, boxY, boxX + boxW - splitX, boxH);
        ctx.clip();
        ctx.fillStyle = '#0f241a';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.fillStyle = '#39ff14';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.fillText('✨ AFTER: SPOTLESS!', boxX + boxW - 80, boxY + 20);
        ctx.fillStyle = '#f6c90e';
        for (let k = 0; k < 6; k++) {
          ctx.fillRect(boxX + 220 + k * 25, boxY + 60 + Math.sin(k + victoryTimer * 4) * 20, 4, 4);
        }
        ctx.restore();

        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(splitX, boxY);
        ctx.lineTo(splitX, boxY + boxH);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.fillText(`GRADE: S RANK (CLEANLINESS MASTER)`, CANVAS_VIEWPORT_SIZE / 2, 260);
        ctx.fillStyle = '#f6c90e';
        ctx.fillText(`TOTAL POINTS BANKED: ${playerPoints} PTS`, CANVAS_VIEWPORT_SIZE / 2, 285);

        ctx.fillStyle = '#00f0ff';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText('TAP [SHOP] TO UPGRADE GEAR OR [START] FOR NEXT', CANVAS_VIEWPORT_SIZE / 2, 335);
      }
    }

    function render() {
      ctx.save();
      if (shakeIntensity > 0) {
        const shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
        const shakeY = (Math.random() - 0.5) * shakeIntensity * 2;
        ctx.translate(Math.round(shakeX), Math.round(shakeY));
      }

      drawMap();
      drawWetTrails();
      drawLureWaves();
      drawTraps();
      drawSlimes();
      drawCobwebs();
      furnitureList.forEach(furn => drawFurnitureItem(furn));
      drawGhostJanitor();
      npcs.forEach(npc => drawPatrollingNPC(npc));
      drawParticles();
      drawFloatingTexts();
      drawOverlays();

      ctx.restore();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    /* ==========================================================================
       VIRTUAL ANALOG JOYSTICK
       ========================================================================== */
    const joystickBase = document.getElementById('joystickBase');
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const joyArrowUp = document.getElementById('joyArrowUp');
    const joyArrowDown = document.getElementById('joyArrowDown');
    const joyArrowLeft = document.getElementById('joyArrowLeft');
    const joyArrowRight = document.getElementById('joyArrowRight');

    let isJoystickActive = false;
    let joystickPointerId = null;
    let joystickTouchId = null;
    const MAX_JOYSTICK_RADIUS = 30;
    const JOYSTICK_DEADZONE = 4;

    function updateJoystickVisuals(dx, dy) {
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      const dist = Math.hypot(dx, dy);
      if (dist < JOYSTICK_DEADZONE) {
        joystickKnob.classList.remove('active');
        joyArrowUp.classList.remove('lit');
        joyArrowDown.classList.remove('lit');
        joyArrowLeft.classList.remove('lit');
        joyArrowRight.classList.remove('lit');
      } else {
        joystickKnob.classList.add('active');
        joyArrowUp.classList.toggle('lit', dy < -8);
        joyArrowDown.classList.toggle('lit', dy > 8);
        joyArrowLeft.classList.toggle('lit', dx < -8);
        joyArrowRight.classList.toggle('lit', dx > 8);
      }
    }

    function processJoystickCoords(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      let clampedX = dx;
      let clampedY = dy;
      if (distance > MAX_JOYSTICK_RADIUS) {
        clampedX = (dx / distance) * MAX_JOYSTICK_RADIUS;
        clampedY = (dy / distance) * MAX_JOYSTICK_RADIUS;
      }

      updateJoystickVisuals(clampedX, clampedY);

      if (distance < JOYSTICK_DEADZONE) {
        inputVector.x = 0;
        inputVector.y = 0;
        inputVector.active = false;
      } else {
        inputVector.x = clampedX / MAX_JOYSTICK_RADIUS;
        inputVector.y = clampedY / MAX_JOYSTICK_RADIUS;
        inputVector.active = true;
      }
    }

    function stopJoystick() {
      isJoystickActive = false;
      joystickPointerId = null;
      joystickTouchId = null;
      inputVector.x = 0;
      inputVector.y = 0;
      inputVector.active = false;
      updateJoystickVisuals(0, 0);
    }

    if (window.PointerEvent) {
      joystickZone.addEventListener('pointerdown', (e) => {
        if (e.cancelable) e.preventDefault();
        audio.init();
        isJoystickActive = true;
        joystickPointerId = e.pointerId;
        try { joystickZone.setPointerCapture(e.pointerId); } catch (_) {}
        processJoystickCoords(e.clientX, e.clientY);
      }, { passive: false });

      window.addEventListener('pointermove', (e) => {
        if (!isJoystickActive || e.pointerId !== joystickPointerId) return;
        processJoystickCoords(e.clientX, e.clientY);
      }, { passive: false });

      const handlePointerEnd = (e) => {
        if (isJoystickActive && e.pointerId === joystickPointerId) {
          try { joystickZone.releasePointerCapture(e.pointerId); } catch (_) {}
          stopJoystick();
        }
      };
      window.addEventListener('pointerup', handlePointerEnd, { passive: false });
      window.addEventListener('pointercancel', handlePointerEnd, { passive: false });
    }

    /* ==========================================================================
       KEYBOARD CONTROLS (WASD / ARROWS / SHORTCUTS)
       ========================================================================== */
    function handleKeyDown(e) {
      audio.init();

      if (['ArrowUp', 'KeyW'].includes(e.code)) { keyboardKeys.up = true; joyArrowUp.classList.add('lit'); e.preventDefault(); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { keyboardKeys.down = true; joyArrowDown.classList.add('lit'); e.preventDefault(); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { keyboardKeys.left = true; joyArrowLeft.classList.add('lit'); e.preventDefault(); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { keyboardKeys.right = true; joyArrowRight.classList.add('lit'); e.preventDefault(); }

      // POSSESS (Space / KeyJ / KeyZ)
      if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyZ') {
        e.preventDefault();
        document.getElementById('btnPossess')?.classList.add('active');
        togglePossession();
      }

      // TRAP (KeyT)
      if (e.code === 'KeyT') {
        e.preventDefault();
        document.getElementById('btnTrap')?.classList.add('active');
        placeSqueakyTrap();
      }

      // SHOP (KeyB)
      if (e.code === 'KeyB') {
        e.preventDefault();
        document.getElementById('btnShop')?.classList.add('active');
        toggleShop();
      }

      // MUSIC (KeyM)
      if (e.code === 'KeyM') {
        e.preventDefault();
        document.getElementById('btnMusic')?.classList.add('active');
        handleMusicButton();
      }

      // START / NEXT (Enter / KeyR)
      if (e.code === 'Enter' || e.code === 'KeyR') {
        e.preventDefault();
        if (busted) loadLevel(currentLevelIndex);
        else if (levelCleared) loadLevel(currentLevelIndex + 1);
      }
    }

    function handleKeyUp(e) {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { keyboardKeys.up = false; joyArrowUp.classList.remove('lit'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { keyboardKeys.down = false; joyArrowDown.classList.remove('lit'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { keyboardKeys.left = false; joyArrowLeft.classList.remove('lit'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { keyboardKeys.right = false; joyArrowRight.classList.remove('lit'); }

      if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyZ') document.getElementById('btnPossess')?.classList.remove('active');
      if (e.code === 'KeyT') document.getElementById('btnTrap')?.classList.remove('active');
      if (e.code === 'KeyB') document.getElementById('btnShop')?.classList.remove('active');
      if (e.code === 'KeyM') document.getElementById('btnMusic')?.classList.remove('active');
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    /* ==========================================================================
       DEDICATED ARCADE BUTTON BINDINGS
       ========================================================================== */
    function bindArcadeButton(btnId, onClick) {
      const el = document.getElementById(btnId);
      if (!el) return;

      let lastTrigger = 0;
      const trigger = (e) => {
        if (e) {
          if (e.cancelable) e.preventDefault();
          e.stopPropagation();
        }
        const now = performance.now();
        if (now - lastTrigger < 200) return;
        lastTrigger = now;

        audio.init();
        el.classList.add('active');
        if (navigator.vibrate) {
          try { navigator.vibrate(14); } catch (_) {}
        }
        onClick();
      };

      const release = (e) => {
        if (e && e.cancelable) e.preventDefault();
        el.classList.remove('active');
      };

      if (window.PointerEvent) {
        el.addEventListener('pointerdown', trigger, { passive: false });
        el.addEventListener('pointerup', release, { passive: false });
        el.addEventListener('pointercancel', release, { passive: false });
      } else {
        el.addEventListener('touchstart', trigger, { passive: false });
        el.addEventListener('touchend', release, { passive: false });
        el.addEventListener('click', trigger);
      }
    }

    // 1. POSSESS
    bindArcadeButton('btnPossess', () => { togglePossession(); });

    // 2. TRAP DECOY
    bindArcadeButton('btnTrap', () => { placeSqueakyTrap(); });

    // 3. SHOP
    bindArcadeButton('btnShop', () => { toggleShop(); });

    // 4. MUSIC
    function handleMusicButton() {
      audio.init();
      audio.toggleMusic();
      audio.playClick();
      updateUI();
    }
    bindArcadeButton('btnMusic', () => { handleMusicButton(); });

    // Canvas Tap to Interact
    const canvasEl = document.getElementById('gameCanvas');
    if (canvasEl) {
      let lastTap = 0;
      canvasEl.addEventListener('pointerdown', (e) => {
        const now = performance.now();
        if (now - lastTap < 220) return;
        lastTap = now;
        togglePossession();
      });
    }

    // Start Game
    initGame();
    requestAnimationFrame((ts) => {
      lastTimestamp = ts;
      gameLoop(ts);
    });

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
