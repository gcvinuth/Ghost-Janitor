        ctx.save();
        ctx.translate(CANVAS_VIEWPORT_SIZE / 2, 155);
        ctx.scale(pulse, pulse);
        
        ctx.font = '16px "Press Start 2P", monospace';
        ctx.fillStyle = '#f6c90e';
        ctx.shadowColor = '#f6c90e';
        ctx.shadowBlur = 12;
        ctx.fillText('FLOOR CLEANSED!', 0, 0);
        ctx.restore();

        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 6;
        ctx.fillText(`FLOOR ${currentLevel.id} COMPLETE ✨`, CANVAS_VIEWPORT_SIZE / 2, 205);

        ctx.fillStyle = '#ffffff';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.shadowBlur = 0;
        ctx.fillText(`ALL ${currentLevel.totalSlimes} ECTOPLASM SPILLS REMOVED`, CANVAS_VIEWPORT_SIZE / 2, 245);
        ctx.fillText('PERFECT STEALTH SANITATION!', CANVAS_VIEWPORT_SIZE / 2, 270);

        const isLastLevel = currentLevelIndex >= LEVELS.length - 1;
        const nextPrompt = isLastLevel ? 'TAP [START] TO REPLAY ALL FLOORS' : `TAP [START] FOR FLOOR ${currentLevel.id + 1}`;

        const blink = Math.floor(gameTime * 2.5) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#00f0ff';
          ctx.font = '9px "Press Start 2P", monospace';
          ctx.fillText(nextPrompt, CANVAS_VIEWPORT_SIZE / 2, 340);
        }
      }
    }

    function render() {
      ctx.save();

      if (shakeIntensity > 0) {
        const shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
        const shakeY = (Math.random() - 0.5) * shakeIntensity * 2;
        ctx.translate(Math.round(shakeX), Math.round(shakeY));
      }

      drawMap();
      drawSlimes();
      furnitureList.forEach(furn => drawFurnitureItem(furn));
      drawGhostJanitor();
      npcs.forEach(npc => drawPatrollingNPC(npc));
      drawParticles();
      drawFloatingTexts();
      drawOverlays();

      ctx.restore();
    }

    /* ==========================================================================
       MAIN ANIMATION LOOP
       ========================================================================== */
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    /* ==========================================================================
       ROBUST VIRTUAL ANALOG JOYSTICK CONTROLLER SYSTEM
       ========================================================================== */
    const joystickBase = document.getElementById('joystickBase');
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const joyArrowUp = document.getElementById('joyArrowUp');
    const joyArrowDown = document.getElementById('joyArrowDown');
    const joyArrowLeft = document.getElementById('joyArrowLeft');
    const joyArrowRight = document.getElementById('joyArrowRight');

    let isJoystickActive = false;
    const MAX_JOYSTICK_RADIUS = 30; // max displacement in pixels
    const JOYSTICK_DEADZONE = 4;

    function updateJoystickVisuals(dx, dy) {
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      
      const dist = Math.hypot(dx, dy);
      if (dist < JOYSTICK_DEADZONE) {
        joystickKnob.classList.remove('active');
        joyArrowUp.classList.remove('lit');
        joyArrowDown.classList.remove('lit');
        joyArrowLeft.classList.remove('lit');
        joyArrowRight.classList.remove('lit');
      } else {
        joystickKnob.classList.add('active');
        joyArrowUp.classList.toggle('lit', dy < -8);
        joyArrowDown.classList.toggle('lit', dy > 8);
        joyArrowLeft.classList.toggle('lit', dx < -8);
        joyArrowRight.classList.toggle('lit', dx > 8);
      }
    }

    function processJoystickCoords(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      let clampedX = dx;
      let clampedY = dy;
      if (distance > MAX_JOYSTICK_RADIUS) {
        clampedX = (dx / distance) * MAX_JOYSTICK_RADIUS;
        clampedY = (dy / distance) * MAX_JOYSTICK_RADIUS;
      }

      updateJoystickVisuals(clampedX, clampedY);

      if (distance < JOYSTICK_DEADZONE) {
        inputVector.x = 0;
        inputVector.y = 0;
        inputVector.active = false;
      } else {
        inputVector.x = clampedX / MAX_JOYSTICK_RADIUS;
        inputVector.y = clampedY / MAX_JOYSTICK_RADIUS;
        inputVector.active = true;
      }
    }

    function stopJoystick() {
      isJoystickActive = false;
      inputVector.x = 0;
      inputVector.y = 0;
      inputVector.active = false;
      updateJoystickVisuals(0, 0);
    }

    // Pointer Events for Global Tracking
    joystickZone.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      audio.init();
      isJoystickActive = true;
      processJoystickCoords(e.clientX, e.clientY);
      if (navigator.vibrate) navigator.vibrate(8);
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      if (!isJoystickActive) return;
      processJoystickCoords(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', (e) => {
      if (isJoystickActive) {
        stopJoystick();
      }
    });

    window.addEventListener('pointercancel', (e) => {
      if (isJoystickActive) {
        stopJoystick();
      }
    });

    // Touch Event Fallbacks
    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      audio.init();
      if (e.touches.length > 0) {
        isJoystickActive = true;
        processJoystickCoords(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isJoystickActive) return;
      if (e.touches.length > 0) {
        processJoystickCoords(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isJoystickActive) {
        stopJoystick();
      }
    });

    /* ==========================================================================
       KEYBOARD CONTROLS (WASD / ARROWS / SHORTCUTS)
       ========================================================================== */
    function handleKeyDown(e) {
      audio.init();

      if (['ArrowUp', 'KeyW'].includes(e.code)) { keyboardKeys.up = true; joyArrowUp.classList.add('lit'); e.preventDefault(); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { keyboardKeys.down = true; joyArrowDown.classList.add('lit'); e.preventDefault(); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { keyboardKeys.left = true; joyArrowLeft.classList.add('lit'); e.preventDefault(); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { keyboardKeys.right = true; joyArrowRight.classList.add('lit'); e.preventDefault(); }

      // Button 1: POSSESS (Space / KeyJ / KeyZ)
      if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyZ') {
        e.preventDefault();
        document.getElementById('btnPossess')?.classList.add('active');
        togglePossession();
      }

      // Button 2: START (Enter / KeyR)
      if (e.code === 'Enter' || e.code === 'KeyR') {
        e.preventDefault();
        document.getElementById('btnStart')?.classList.add('active');
        handleStartButton();
      }

      // Button 3: MUSIC (KeyM)
      if (e.code === 'KeyM') {
        e.preventDefault();
        document.getElementById('btnMusic')?.classList.add('active');
        handleMusicButton();
      }
    }

    function handleKeyUp(e) {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { keyboardKeys.up = false; joyArrowUp.classList.remove('lit'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { keyboardKeys.down = false; joyArrowDown.classList.remove('lit'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { keyboardKeys.left = false; joyArrowLeft.classList.remove('lit'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { keyboardKeys.right = false; joyArrowRight.classList.remove('lit'); }

      if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyZ') {
        document.getElementById('btnPossess')?.classList.remove('active');
      }
      if (e.code === 'Enter' || e.code === 'KeyR') {
        document.getElementById('btnStart')?.classList.remove('active');
      }
      if (e.code === 'KeyM') {
        document.getElementById('btnMusic')?.classList.remove('active');
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    /* ==========================================================================
       3 DEDICATED BUTTON HANDLERS (POSSESS, START, MUSIC)
       ========================================================================== */
    function bindArcadeButton(btnId, onClick) {
      const el = document.getElementById(btnId);
      if (!el) return;

      const press = (e) => {
        e.preventDefault();
        audio.init();
        el.classList.add('active');
        if (navigator.vibrate) navigator.vibrate(12);
        onClick();
      };

      const release = (e) => {
        e.preventDefault();
        el.classList.remove('active');
      };

      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointerleave', release);
      el.addEventListener('touchstart', press, { passive: false });
      el.addEventListener('touchend', release, { passive: false });
    }

    // 1. POSSESS Button
    bindArcadeButton('btnPossess', () => {
      togglePossession();
    });

    // 2. START Button
    function handleStartButton() {
      audio.playClick();
      if (busted) {
        loadLevel(currentLevelIndex);
      } else if (levelCleared) {
        loadLevel(currentLevelIndex + 1);
      } else {
        initGame();
      }
    }

    bindArcadeButton('btnStart', () => {
      handleStartButton();
    });

    // 3. MUSIC Button
    function handleMusicButton() {
      audio.init();
      audio.toggleMusic();
      audio.playClick();
      updateUI();
    }

    bindArcadeButton('btnMusic', () => {
      handleMusicButton();
    });

    // Start initial game
    initGame();
    requestAnimationFrame((ts) => {
      lastTimestamp = ts;
      gameLoop(ts);
    });

    // ==========================================
    // PWA: Service Worker Registration & Install
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            console.log('[PWA] Service Worker registered successfully! Scope:', reg.scope);
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version installed and ready.');
                  }
                };
              }
            };
          })
          .catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }

    // PWA Install Prompt handling
    let deferredInstallPrompt = null;
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (pwaInstallBtn) {
        pwaInstallBtn.style.display = 'inline-flex';
      }
    });

    if (pwaInstallBtn) {
      pwaInstallBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          console.log('[PWA] User accepted the install prompt');
        }
        deferredInstallPrompt = null;
        pwaInstallBtn.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App successfully installed on device');
      if (pwaInstallBtn) {
        pwaInstallBtn.style.display = 'none';
      }
      deferredInstallPrompt = null;
    });
  </script>
</body>
</html>
