<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a45"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas with Rounded Border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#4a3473" stroke-width="12"/>

  <!-- Glowing Ghost Aura -->
  <g filter="url(#neonGlow)">
    <!-- Janitor Cap -->
    <path d="M 170 120 L 330 120 L 330 150 L 360 160 L 360 180 L 140 180 L 140 160 L 170 150 Z" fill="#9d4edd" stroke="#3c2a63" stroke-width="4"/>
    <circle cx="250" cy="150" r="14" fill="#f6c90e"/>

    <!-- Ghost Body -->
    <path d="M 140 200 
             C 140 140, 360 140, 360 200 
             L 360 380 
             L 330 350 
             L 300 380 
             L 270 350 
             L 240 380 
             L 210 350 
             L 180 380 
             L 140 340 Z" 
          fill="#00f0ff" />

    <!-- Cute Ghost Face & Cheeks -->
    <!-- Eyes -->
    <rect x="200" y="220" width="28" height="40" rx="8" fill="#0d0818"/>
    <rect x="272" y="220" width="28" height="40" rx="8" fill="#0d0818"/>
    <!-- Eye Highlights -->
    <circle cx="210" cy="230" r="6" fill="#ffffff"/>
    <circle cx="282" cy="230" r="6" fill="#ffffff"/>

    <!-- Cheeks -->
    <ellipse cx="180" cy="270" rx="14" ry="8" fill="#f72585" opacity="0.6"/>
    <ellipse cx="320" cy="270" rx="14" ry="8" fill="#f72585" opacity="0.6"/>

    <!-- Mouth -->
    <path d="M 235 270 Q 250 285 265 270" stroke="#0d0818" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Janitor Broom / Mop Accessory -->
    <!-- Broom Handle -->
    <line x1="340" y1="220" x2="410" y2="400" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
    <!-- Pink Neon Bristles -->
    <path d="M 390 380 L 435 395 L 420 440 L 375 425 Z" fill="#f72585"/>
    <line x1="380" y1="420" x2="430" y2="435" stroke="#f6c90e" stroke-width="4"/>

    <!-- Sparkles -->
    <path d="M 120 160 L 130 140 L 140 160 L 160 170 L 140 180 L 130 200 L 120 180 L 100 170 Z" fill="#39ff14"/>
    <path d="M 370 120 L 376 106 L 382 120 L 396 126 L 382 132 L 376 146 L 370 132 L 356 126 Z" fill="#f6c90e"/>
  </g>
</svg>
