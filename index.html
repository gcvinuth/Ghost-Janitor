<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ghost Janitor - 8-Bit Game Boy Arcade</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="description" content="Retro 8-Bit Game Boy arcade puzzle game. Possess cleaning tools, tidy haunted multi-room mansions, and defeat rogue dust phantoms!">
  <meta name="theme-color" content="#231b38">
  <meta name="background-color" content="#0d0818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghost Janitor">
  <meta name="application-name" content="Ghost Janitor">
  <meta name="msapplication-TileColor" content="#231b38">
  <meta name="msapplication-config" content="browserconfig.xml">

  <!-- Manifest Links -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="manifest" href="manifest.json">

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --gb-body: #231b38;
      --gb-body-dark: #150f24;
      --gb-bezel: #0d0818;
      --gb-accent-purple: #9d4edd;
      --gb-accent-pink: #f72585;
      --gb-accent-cyan: #00f0ff;
      --gb-accent-green: #39ff14;
      --gb-accent-gold: #f6c90e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b1035 0%, #080410 100%);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* Main Game Boy Handheld Chassis */
    .gameboy-console {
      position: relative;
      background: linear-gradient(170deg, #2e214c 0%, #1a1230 65%, #120b22 100%);
      border-radius: 24px 24px 34px 24px;
      padding: 10px 14px 14px;
      box-shadow: 
        0 0 35px rgba(157, 78, 221, 0.35),
        0 15px 35px rgba(0, 0, 0, 0.9),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -5px 10px rgba(0, 0, 0, 0.8);
      border: 3px solid #4a3473;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      max-height: 98dvh;
      margin: auto;
    }

    /* Game Boy Top Header Bar */
    .gb-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px 6px;
      border-bottom: 2px solid #3c2a63;
      margin-bottom: 6px;
    }

    .gb-grooves {
      display: flex;
      gap: 3px;
    }

    .gb-groove-line {
      width: 18px;
      height: 3px;
      background: #140d24;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .gb-logo-brand {
      font-size: 0.62rem;
      color: #00f0ff;
      letter-spacing: 1.2px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 15px #f72585;
      font-style: italic;
    }

    /* PWA Install Button */
    .pwa-install-btn {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      background: linear-gradient(135deg, #f72585, #7209b7);
      color: #fff;
      border: 1px solid #ff70a6;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(247, 37, 133, 0.6);
      animation: pulseInstall 2s infinite ease-in-out;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .pwa-install-btn:hover {
      background: #ff0055;
      box-shadow: 0 0 12px #ff0055;
      transform: scale(1.04);
    }
    @keyframes pulseInstall {
      0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(247, 37, 133, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 12px rgba(247, 37, 133, 0.9); }
    }

    .power-led-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .power-led-label {
      font-size: 0.38rem;
      color: #a594c7;
      letter-spacing: 0.5px;
    }

    .power-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #39ff14;
      box-shadow: 0 0 8px #39ff14, 0 0 14px #39ff14;
      transition: all 0.2s ease;
    }

    .power-led.panic {
      background: #ff0055;
      box-shadow: 0 0 10px #ff0055, 0 0 18px #ff0055;
      animation: ledBlink 0.3s infinite alternate;
    }

    @keyframes ledBlink {
      0% { filter: brightness(1); transform: scale(1); }
      100% { filter: brightness(1.8); transform: scale(1.25); }
    }

    /* Screen Glass Bezel */
    .gb-screen-bezel {
      width: 100%;
      background: #0e0a1a;
      border: 3px solid #1a1030;
      border-radius: 12px 12px 24px 12px;
      padding: 6px 8px 8px;
      box-shadow: 
        inset 0 0 16px rgba(0, 0, 0, 0.95),
        0 4px 10px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Bezel Sub-header lines */
    .bezel-top-deco {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .bezel-deco-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #ff0077, #9d4edd, #00f0ff);
      border-radius: 2px;
    }

    .bezel-title {
      font-size: 0.42rem;
      color: #9d4edd;
      margin: 0 8px;
      letter-spacing: 1px;
    }

    /* Compact Integrated HUD */
    .gb-hud {
      width: 100%;
      background: rgba(10, 6, 20, 0.92);
      border: 1px solid #4a3473;
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.5rem;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .hud-left-stats {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-floor-badge {
      font-size: 0.45rem;
      color: #f6c90e;
      background: #2b1842;
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid #8e44ad;
      letter-spacing: 0.5px;
    }

    .hud-cleanliness {
      color: #39ff14;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hud-stealth-pill {
      font-size: 0.42rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e1438;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .hud-stealth-pill.hidden {
      border-color: #39ff14;
      color: #39ff14;
      background: #0f3d1f;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.8);
      animation: stealthGlow 1.2s infinite alternate;
    }

    @keyframes stealthGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    .panic-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      max-width: 170px;
    }

    .panic-bar-outer {
      flex: 1;
      height: 9px;
      background: #180d26;
      border: 1px solid #ff0055;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .panic-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc00, #ff0055);
      transition: width 0.1s linear;
      box-shadow: 0 0 8px #ff0055;
    }

    .panic-bar-inner.warning {
      animation: panicPulse 0.3s infinite alternate;
    }

    @keyframes panicPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.6); }
    }

    .hud-room-tag {
      font-size: 0.42rem;
      color: #00f0ff;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 170px;
      letter-spacing: 0.5px;
    }

    /* Screen Bezel & Canvas wrapper */
    .screen-container {
      position: relative;
      background: #000;
      border: 2px solid #2e1d4d;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95);
    }

    /* CRT Scanline & Dot Matrix LCD Effect */
    .screen-container::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.32) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 255, 0, 0.03)
      );
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
      z-index: 10;
    }

    .screen-container::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 70%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .panic-alert-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      box-shadow: inset 0 0 50px rgba(255, 0, 85, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transition: opacity 0.15s ease-in-out;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      max-width: min(88vw, 360px, 42vh);
      aspect-ratio: 1 / 1;
      height: auto;
      background-color: #0d091a;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ==========================================================================
       PROPERLY DESIGNED ARCADE CONTROLS DECK (JOYSTICK + 3 BUTTONS)
       ========================================================================== */
    .gb-controls-deck {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      gap: 10px;
    }

    /* VIRTUAL ANALOG JOYSTICK */
    .joystick-zone {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .joystick-base {
      position: relative;
      width: 112px;
      height: 112px;
      background: radial-gradient(circle at 40% 40%, #2a1b47 0%, #120b22 70%, #080410 100%);
      border-radius: 50%;
      border: 3px solid #5a3c8c;
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.15),
        inset 0 -4px 8px rgba(0, 0, 0, 0.85),
        0 6px 12px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: grab;
    }

    .joystick-base:active {
      cursor: grabbing;
    }

    .joystick-ring-deco {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1.5px dashed rgba(157, 78, 221, 0.4);
      pointer-events: none;
    }

    .joystick-indicator {
      position: absolute;
      font-size: 0.55rem;
      color: rgba(157, 78, 221, 0.65);
      pointer-events: none;
      transition: color 0.1s, transform 0.1s;
    }
    .joystick-indicator.up { top: 4px; }
    .joystick-indicator.down { bottom: 4px; }
    .joystick-indicator.left { left: 6px; }
    .joystick-indicator.right { right: 6px; }

    .joystick-indicator.lit {
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
      transform: scale(1.3);
    }

    .joystick-knob {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #9d4edd 0%, #4a127a 60%, #1b072e 100%);
      border: 2.5px solid #c77dff;
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.9),
        0 0 14px rgba(157, 78, 221, 0.6),
        inset 0 2px 5px rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform;
    }

    .joystick-knob-core {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f0ff 0%, #7209b7 100%);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .joystick-knob.active {
      box-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 240, 255, 0.95),
        inset 0 2px 5px rgba(255, 255, 255, 0.7);
      border-color: #00f0ff;
    }

    /* 3 DEDICATED BUTTONS ARCADE DECK */
    .gb-arcade-buttons-deck {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(145deg, #1b122e 0%, #0d0818 100%);
      padding: 8px 12px;
      border-radius: 28px;
      border: 1.5px solid #3c295c;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08), 0 4px 10px rgba(0, 0, 0, 0.7);
    }

    .arcade-btn-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .arcade-custom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      transition: all 0.08s ease;
      touch-action: none;
      position: relative;
      outline: none;
    }

    /* 1. POSSESS BUTTON */
    .btn-possess-style {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f72585, #7209b7);
      border: 2px solid #ff70a6;
      box-shadow: 0 4px 0 #3a001a, 0 0 14px rgba(247, 37, 133, 0.6);
      color: #fff;
      font-size: 0.44rem;
      gap: 2px;
    }

    .btn-possess-style:active, .btn-possess-style.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #3a001a, 0 0 22px rgba(247, 37, 133, 1);
      background: #ff0055;
    }

    .btn-possess-style.eject-mode {
      background: linear-gradient(145deg, #39ff14, #0f7a28);
      border-color: #a8ff78;
      box-shadow: 0 4px 0 #053310, 0 0 16px rgba(57, 255, 20, 0.7);
    }

    .btn-possess-style.eject-mode:active, .btn-possess-style.eject-mode.active {
      background: #39ff14;
      box-shadow: 0 1px 0 #053310, 0 0 24px rgba(57, 255, 20, 1);
    }

    /* 2. START / RESTART BUTTON */
    .btn-start-style {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f6c90e, #d35400);
      border: 2px solid #ffe066;
      box-shadow: 0 4px 0 #4a1d00, 0 0 12px rgba(246, 201, 14, 0.5);
      color: #fff;
      font-size: 0.38rem;
      gap: 2px;
    }

    .btn-start-style:active, .btn-start-style.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4a1d00, 0 0 20px rgba(246, 201, 14, 0.9);
      background: #ffb703;
    }

    /* 3. MUSIC BUTTON */
    .btn-music-style {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #00b4d8, #03045e);
      border: 2px solid #90e0ef;
      box-shadow: 0 4px 0 #021330, 0 0 12px rgba(0, 180, 216, 0.5);
      color: #fff;
      font-size: 0.38rem;
      gap: 2px;
    }

    .btn-music-style:active, .btn-music-style.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #021330, 0 0 20px rgba(0, 240, 255, 0.9);
      background: #00f0ff;
    }

    .btn-music-style.muted {
      background: linear-gradient(145deg, #495057, #212529);
      border-color: #6c757d;
      box-shadow: 0 4px 0 #111, 0 0 4px rgba(0, 0, 0, 0.5);
      color: #888;
    }

    .btn-sub-label {
      font-size: 0.36rem;
      color: #cfc2eb;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Small Screen & Mobile Landscape Optimization */
    @media (max-height: 580px) and (orientation: landscape) {
      .gameboy-console {
        flex-direction: row;
        max-width: 96vw;
        max-height: 96dvh;
        padding: 6px 12px;
        gap: 12px;
        border-radius: 20px;
      }
      .gb-header {
        display: none;
      }
      .gb-screen-bezel {
        max-width: 48%;
        padding: 4px;
      }
      .gb-controls-deck {
        flex: 1;
        padding-top: 0;
      }
      canvas#gameCanvas {
        max-width: min(44vw, 42vh);
      }
      .joystick-zone {
        width: 100px;
        height: 100px;
      }
      .joystick-base {
        width: 92px;
        height: 92px;
      }
      .joystick-knob {
        width: 42px;
        height: 42px;
      }
      .btn-possess-style {
        width: 46px;
        height: 46px;
        font-size: 0.38rem;
      }
      .btn-start-style, .btn-music-style {
        width: 38px;
        height: 38px;
        font-size: 0.34rem;
      }
    }

    @media (max-width: 380px) {
      .gameboy-console {
        padding: 6px 8px 10px;
      }
      .joystick-zone {
        width: 104px;
        height: 104px;
      }
      .joystick-base {
        width: 96px;
        height: 96px;
      }
      .joystick-knob {
        width: 44px;
        height: 44px;
      }
      .gb-arcade-buttons-deck {
        padding: 6px 8px;
        gap: 6px;
      }
      .btn-possess-style {
        width: 48px;
        height: 48px;
      }
      .btn-start-style, .btn-music-style {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>

  <main class="gameboy-console" role="region" aria-label="Ghost Janitor Handheld Console">
    <!-- Top Game Boy Header -->
    <header class="gb-header">
      <div class="gb-grooves">
        <div class="gb-groove-line"></div>
        <div class="gb-groove-line"></div>
        <div class="gb-groove-line"></div>
      </div>
      <div class="gb-logo-brand">GHOST JANITOR 8-BIT</div>
      <button id="pwaInstallBtn" class="pwa-install-btn" title="Install App for Offline Play" aria-label="Install App">⚡ INSTALL</button>
      <div class="power-led-group">
        <div class="power-led-label">PWR</div>
        <div id="powerLed" class="power-led"></div>
      </div>
    </header>

    <!-- Screen Bezel -->
    <section class="gb-screen-bezel">
      <div class="bezel-top-deco">
        <div class="bezel-deco-line"></div>
        <div class="bezel-title">DOT MATRIX CHIPTUNE SOUND</div>
        <div class="bezel-deco-line"></div>
      </div>

      <!-- Integrated HUD Inside Bezel -->
      <div class="gb-hud">
        <div class="hud-row">
          <div class="hud-left-stats">
            <span id="floorBadge" class="hud-floor-badge">FLOOR 1</span>
            <div class="hud-cleanliness">
              <span>✨</span>
              <span>CLEAN:</span>
              <span id="scoreText" style="color: #39ff14; font-size: 0.6rem;">0 / 25</span>
            </div>
          </div>
          <div id="stealthBadge" class="hud-stealth-pill">GHOST FORM</div>
        </div>

        <div class="hud-row">
          <div class="panic-wrap">
            <span style="color: #ff3366; font-size: 0.42rem;">PANIC:</span>
            <div class="panic-bar-outer">
              <div id="panicBar" class="panic-bar-inner"></div>
            </div>
            <span id="panicPercent" style="font-size: 0.42rem; color: #ff3366; width: 28px;">0%</span>
          </div>
          <div id="roomTag" class="hud-room-tag">📍 GRAND FOYER</div>
        </div>
      </div>

      <!-- Screen Container with Pixel Canvas -->
      <div class="screen-container" id="screenBezel">
        <div id="panicAlert" class="panic-alert-overlay"></div>
        <canvas id="gameCanvas" width="512" height="512"></canvas>
      </div>
    </section>

    <!-- Game Boy Controller Deck: JOYSTICK + 3 BUTTONS (POSSESS, START, MUSIC) -->
    <footer class="gb-controls-deck">
      <!-- Left: Smooth 360-degree Virtual Analog Joystick -->
      <div class="joystick-zone" id="joystickZone">
        <div class="joystick-base" id="joystickBase">
          <div class="joystick-ring-deco"></div>
          <span class="joystick-indicator up" id="joyArrowUp">▲</span>

    /* ==========================================================================
       8-BIT RETRO CHIPTUNE SOUND SYNTHESIZER & BGM ENGINE (Web Audio API)
       ========================================================================== */
    class RetroAudioEngine {
      constructor() {
        this.ctx = null;
        this.musicEnabled = true;
        this.sfxEnabled = true;
        this.lastAlertTime = 0;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.tempo = 145; // BPM
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startBGM() {
        if (this.bgmTimer || !this.musicEnabled) return;
        this.init();
        if (!this.ctx) return;

        const stepTimeMs = (60 / this.tempo / 4) * 1000;
        this.bgmStep = 0;
        this.bgmTimer = setInterval(() => {
          this.playBGMStep();
        }, stepTimeMs);
      }

      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        if (this.musicEnabled) {
          this.init();
          this.startBGM();
        } else {
          this.stopBGM();
        }
        return this.musicEnabled;
      }

      playBGMStep() {
        if (!this.musicEnabled || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const step = this.bgmStep % 32;

        // Chiptune Bassline (Triangle)
        const bassNotes = [
          110, 0, 110, 0,  130.81, 0, 110, 0,
          98, 0, 98, 0,   123.47, 0, 98, 0,
          87.31, 0, 87.31, 0, 110, 0, 87.31, 0,
          98, 0, 110, 0,  123.47, 0, 130.81, 146.83
        ];

        const bassFreq = bassNotes[step];
        if (bassFreq > 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(bassFreq, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        }

        // Spooky Lead Melody (Square Wave)
        const leadNotes = [
          440, 0, 523.25, 0,  659.25, 0, 587.33, 0,
          440, 0, 392, 0,     440, 0, 0, 0,
          349.23, 0, 440, 0,  523.25, 0, 440, 0,
          392, 0, 440, 0,     493.88, 0, 523.25, 0
        ];

        const leadFreq = leadNotes[step];
        if (leadFreq > 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(leadFreq, now);
          gain.gain.setValueAtTime(0.045, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        // 8-bit Noise Hi-Hat / Snare rhythm
        if (step % 4 === 2) {
          this.playNoiseTick(0.04, 0.02);
        }

        this.bgmStep++;
      }

      playNoiseTick(dur, vol) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * dur;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(4000, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      playSlimeClean() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.16);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);

        const chime = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chime.type = 'sine';
        chime.frequency.setValueAtTime(1300, now + 0.04);
        chime.frequency.exponentialRampToValueAtTime(2100, now + 0.16);

        chimeGain.gain.setValueAtTime(0.18, now + 0.04);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        chime.connect(chimeGain);
        chimeGain.connect(this.ctx.destination);
        chime.start(now + 0.04);
        chime.stop(now + 0.22);
      }

      playPossess() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

      playPanicAlert() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (now - this.lastAlertTime < 0.18) return;
        this.lastAlertTime = now;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.setValueAtTime(840, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);

      playBump() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();

        gain.gain.setValueAtTime(0.12, now);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);

      playBusted() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const tones = [420, 350, 260, 180, 120];

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + i * 0.11);

          gain.gain.setValueAtTime(0.25, now + i * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.18);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.11);
          osc.stop(now + i * 0.11 + 0.2);
        });
      }

      playVictory() {
        if (!this.sfxEnabled) return;

        const notes = [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1318.51];

          const osc = this.ctx.createOscillator();

          gain.gain.setValueAtTime(0.22, now + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.09);
          osc.stop(now + i * 0.09 + 0.22);
        });
      }

      playClick() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }
    }

    /* Generate Procedural Multi-Room Grid for Level */
    function generateLevelMap(level) {
      const grid = [];
      const cols = level.cols;
      const rows = level.rows;

      // Fill with floor
      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          if (x === 0 || x === cols - 1 || y === 0 || y === rows - 1) {
            row.push(TILE.WALL);
          } else {
            row.push(TILE.FLOOR);
          }
        }
        grid.push(row);
      }

      // Add room partitions
      level.rooms.forEach(room => {
        for (let y = room.y1; y <= room.y2; y++) {
          if (room.x1 > 0 && room.x1 < cols - 1) grid[y][room.x1] = TILE.WALL;
          if (room.x2 > 0 && room.x2 < cols - 1) grid[y][room.x2] = TILE.WALL;
        }
        for (let x = room.x1; x <= room.x2; x++) {
          if (room.y1 > 0 && room.y1 < rows - 1) grid[room.y1][x] = TILE.WALL;
          if (room.y2 > 0 && room.y2 < rows - 1) grid[room.y2][x] = TILE.WALL;
        }
      });

      // Punch wide doorways (2-3 tiles wide) between all adjacent rooms
      level.rooms.forEach(room => {
        const midX = Math.floor((room.x1 + room.x2) / 2);
        const midY = Math.floor((room.y1 + room.y2) / 2);

        if (room.y1 > 0) {
          grid[room.y1][midX] = TILE.FLOOR;
          if (midX + 1 < cols - 1) grid[room.y1][midX + 1] = TILE.FLOOR;
          if (midX - 1 > 0) grid[room.y1][midX - 1] = TILE.FLOOR;
        }
        if (room.y2 < rows - 1) {
          grid[room.y2][midX] = TILE.FLOOR;
          if (midX + 1 < cols - 1) grid[room.y2][midX + 1] = TILE.FLOOR;
          if (midX - 1 > 0) grid[room.y2][midX - 1] = TILE.FLOOR;
        }
        if (room.x1 > 0) {
          grid[midY][room.x1] = TILE.FLOOR;
          if (midY + 1 < rows - 1) grid[midY + 1][room.x1] = TILE.FLOOR;
          if (midY - 1 > 0) grid[midY - 1][room.x1] = TILE.FLOOR;
        }
        if (room.x2 < cols - 1) {
          grid[midY][room.x2] = TILE.FLOOR;
          if (midY + 1 < rows - 1) grid[midY + 1][room.x2] = TILE.FLOOR;
          if (midY - 1 > 0) grid[midY - 1][room.x2] = TILE.FLOOR;
        }
      });

      // Ensure spawn tile and surroundings are completely clear
      const sx = Math.floor(level.spawnX);
      const sy = Math.floor(level.spawnY);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (sy + dy > 0 && sy + dy < rows - 1 && sx + dx > 0 && sx + dx < cols - 1) {
            grid[sy + dy][sx + dx] = TILE.FLOOR;
          }
        }
      }

      return grid;
    }

    /* ==========================================================================

       ========================================================================== */
    function isWalkable(gridX, gridY) {
      if (gridX < 0 || gridX >= currentLevel.cols || gridY < 0 || gridY >= currentLevel.rows) {
        return false;
      }
      return levelMap[gridY][gridX] === TILE.FLOOR;
    }

    function checkWallCollision(px, py, radius) {
      const minX = Math.floor((px - radius) / TILE_SIZE);
      const maxX = Math.floor((px + radius) / TILE_SIZE);
      const minY = Math.floor((py - radius) / TILE_SIZE);
      const maxY = Math.floor((py + radius) / TILE_SIZE);

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if (!isWalkable(x, y)) {
            const tileLeft = x * TILE_SIZE;
            const tileTop = y * TILE_SIZE;
            const closestX = Math.max(tileLeft, Math.min(px, tileLeft + TILE_SIZE));
            const closestY = Math.max(tileTop, Math.min(py, tileTop + TILE_SIZE));
            
            const dx = px - closestX;
            const dy = py - closestY;
            if (dx * dx + dy * dy < radius * radius) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function findBFSPath(startX, startY, targetX, targetY) {
      if (startX === targetX && startY === targetY) return [];

      const queue = [{ x: startX, y: startY, path: [] }];
      const visited = new Set();
      visited.add(`${startX},${startY}`);

      let stepsLimit = 1200;

      while (queue.length > 0 && stepsLimit-- > 0) {
        const current = queue.shift();
        
        if (current.x === targetX && current.y === targetY) {
          return current.path;
        }

        const neighbors = [
          { x: current.x + 1, y: current.y, dir: 'right' },
          { x: current.x - 1, y: current.y, dir: 'left' },
          { x: current.x, y: current.y + 1, dir: 'down' },
          { x: current.x, y: current.y - 1, dir: 'up' }
        ];

        for (const nb of neighbors) {
          const key = `${nb.x},${nb.y}`;
          if (isWalkable(nb.x, nb.y) && !visited.has(key)) {
            visited.add(key);
            queue.push({
              x: nb.x,
              y: nb.y,
              path: [...current.path, { x: nb.x, y: nb.y, dir: nb.dir }]
            });
          }
        }
      }
      return [];
    }

    function getAngleForDirection(dir) {
      switch (dir) {
        case 'right': return 0;
        case 'down': return Math.PI / 2;
        case 'left': return Math.PI;
        case 'up': return -Math.PI / 2;
        default: return 0;
      }
    }

    function getCurrentRoomName(px, py) {
      const gx = Math.floor(px / TILE_SIZE);
      const gy = Math.floor(py / TILE_SIZE);

      for (const room of currentLevel.rooms) {
        if (gx >= room.x1 && gx <= room.x2 && gy >= room.y1 && gy <= room.y2) {
          return room.name;
        }
      }
      return "Haunted Hallway";
    }

    function pickNextNPCDestination(npc) {
      let nextIdx = Math.floor(Math.random() * currentLevel.patrolWaypoints.length);
      while (nextIdx === npc.currentWaypointIdx && currentLevel.patrolWaypoints.length > 1) {
        nextIdx = Math.floor(Math.random() * currentLevel.patrolWaypoints.length);
      }
      npc.currentWaypointIdx = nextIdx;
      const targetWp = currentLevel.patrolWaypoints[nextIdx];

      const curGridX = Math.floor(npc.x / TILE_SIZE);
      const curGridY = Math.floor(npc.y / TILE_SIZE);

      npc.currentPath = findBFSPath(curGridX, curGridY, targetWp.x, targetWp.y);
      npc.pathIndex = 0;
      npc.state = 'patrolling';
    }

    /* ==========================================================================
       INITIALIZATION & SPAWNING
       ========================================================================== */
    function loadLevel(levelIdx) {
      currentLevelIndex = (levelIdx + LEVELS.length) % LEVELS.length;
      currentLevel = LEVELS[currentLevelIndex];
      levelMap = generateLevelMap(currentLevel);

      score = 0;
      panicMeter = 0;
      slimes = [];
      furnitureList = [];
      particles = [];
      floatingTexts = [];
      npcs = [];
      shakeIntensity = 0;
      shakeDuration = 0;
      gameOver = false;
      busted = false;
      levelCleared = false;

      // Reset Player inside starting Foyer
      player.x = currentLevel.spawnX * TILE_SIZE;
      player.y = currentLevel.spawnY * TILE_SIZE;
      player.direction = 'down';
      player.isPossessing = false;
      player.possessedFurniture = null;

      // Find all empty walkable tiles away from spawn
      const emptyTiles = [];
      for (let y = 1; y < currentLevel.rows - 1; y++) {
        for (let x = 1; x < currentLevel.cols - 1; x++) {
          if (levelMap[y][x] === TILE.FLOOR) {
            const dx = x - currentLevel.spawnX;
            const dy = y - currentLevel.spawnY;
            if (dx * dx + dy * dy > 8) {
              emptyTiles.push({ x, y });
            }
          }
        }
      }

      // Shuffle empty tiles
      for (let i = emptyTiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [emptyTiles[i], emptyTiles[j]] = [emptyTiles[j], emptyTiles[i]];
      }

      // Spawn Furniture Items
      const furnitureTypes = ['armchair', 'clock', 'table', 'lamp', 'chair', 'mirror_cabinet', 'piano'];
      for (let i = 0; i < currentLevel.totalFurniture; i++) {
        if (emptyTiles.length === 0) break;
        const tile = emptyTiles.pop();
        furnitureList.push({
          id: i,
          type: furnitureTypes[i % furnitureTypes.length],
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE,
          radius: 14,
          isPossessed: false
        });
      }

      // Spawn Multi-Type Slime Spills (Standard Green, Mega Cyan, Sparkle Purple)
      const slimeCount = Math.min(currentLevel.totalSlimes, emptyTiles.length);
      for (let i = 0; i < slimeCount; i++) {
        const tile = emptyTiles.pop();
        const slimeTypeRoll = Math.random();
        let sType = 'green';
        let sRadius = 10;
        let sPoints = 1;
        let sColor = '#39ff14';

        if (slimeTypeRoll > 0.75) {
          sType = 'purple';
          sRadius = 11;
          sPoints = 1;
          sColor = '#f72585';
        } else if (slimeTypeRoll > 0.55) {
          sType = 'cyan';
          sRadius = 13;
          sPoints = 2;
          sColor = '#00f0ff';
        }

        slimes.push({
          id: i,
          type: sType,
          points: sPoints,
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE,
          radius: sRadius,
          color: sColor,
          bubblePhase: Math.random() * Math.PI * 2,
          bubbleSpeed: 2.2 + Math.random() * 3
        });
      }

      // Initialize Patrolling NPCs for this floor
      currentLevel.npcs.forEach((npcDef, i) => {
        const startWpIdx = (i * 3 + 2) % currentLevel.patrolWaypoints.length;
        const wp = currentLevel.patrolWaypoints[startWpIdx];
        const npc = {
          id: i,
          name: npcDef.name,
          x: (wp.x + 0.5) * TILE_SIZE,
          y: (wp.y + 0.5) * TILE_SIZE,
          radius: npcDef.radius,
          speed: npcDef.speed,
          direction: 'down',
          visionAngleFacing: Math.PI / 2,
          targetVisionAngle: Math.PI / 2,
          visionLength: npcDef.visionLength,
          visionAngle: npcDef.visionAngle,
          walkFrame: 0,
          currentPath: [],
          pathIndex: 0,
          currentWaypointIdx: startWpIdx,
          state: 'patrolling',
          inspectTimer: 0,
          inspectPhase: 0
        };
        pickNextNPCDestination(npc);
        npcs.push(npc);
      });

      // Center camera on player
      camera.x = player.x - CANVAS_VIEWPORT_SIZE / 2;
      camera.y = player.y - CANVAS_VIEWPORT_SIZE / 2;

      updateUI();
    }

    function initGame() {
      loadLevel(0);
      audio.startBGM();
    }

    function updateUI() {
      // Floor & Clean Score
      document.getElementById('floorBadge').textContent = `FLOOR ${currentLevel.id}`;
      document.getElementById('scoreText').textContent = `${score} / ${currentLevel.totalSlimes}`;
      
      // Panic Bar
      const panicPercent = Math.min(100, Math.max(0, Math.floor(panicMeter)));
      const panicBar = document.getElementById('panicBar');
      const panicText = document.getElementById('panicPercent');
      const panicAlert = document.getElementById('panicAlert');
      const powerLed = document.getElementById('powerLed');
      
      panicBar.style.width = `${panicPercent}%`;
      panicText.textContent = `${panicPercent}%`;

      if (panicPercent > 40) {
        panicBar.classList.add('warning');
        powerLed.classList.add('panic');
        panicAlert.style.opacity = `${(panicPercent - 35) / 65 * 0.75}`;
      } else {
        panicBar.classList.remove('warning');
        powerLed.classList.remove('panic');
        panicAlert.style.opacity = '0';
      }

      // Stealth State Badge & Possess Button Text
      const stealthBadge = document.getElementById('stealthBadge');
      const btnPossess = document.getElementById('btnPossess');
      const btnPossessText = document.getElementById('btnPossessText');
      const btnPossessIcon = document.getElementById('btnPossessIcon');

      if (player.isPossessing && player.possessedFurniture) {
        stealthBadge.textContent = `HIDDEN: ${player.possessedFurniture.type.toUpperCase()}`;
        stealthBadge.className = 'hud-stealth-pill hidden';
        btnPossess.classList.add('eject-mode');
        btnPossessText.textContent = 'EJECT';
        btnPossessIcon.textContent = '⚡';
      } else {
        stealthBadge.textContent = 'GHOST FORM';
        stealthBadge.className = 'hud-stealth-pill';
        btnPossess.classList.remove('eject-mode');
        btnPossessText.textContent = 'POSSESS';
        btnPossessIcon.textContent = '👻';
      }

      // Room Name Tag
      const currentRoom = getCurrentRoomName(player.x, player.y);
      document.getElementById('roomTag').textContent = `📍 ${currentRoom.toUpperCase()}`;

      // Music Button UI
      const btnMusic = document.getElementById('btnMusic');
      const musicIcon = document.getElementById('musicIcon');
      const musicText = document.getElementById('musicText');
      if (audio.musicEnabled) {
        btnMusic.classList.remove('muted');
        musicIcon.textContent = '🎵';
        musicText.textContent = 'BGM ON';
      } else {
        btnMusic.classList.add('muted');
        musicIcon.textContent = '🔇';
        musicText.textContent = 'MUTED';
      }
    }

    /* ==========================================================================
       FIXED & ENHANCED FURNITURE POSSESSION MECHANIC
       ========================================================================== */
    function togglePossession() {
      audio.init();
      if (navigator.vibrate) navigator.vibrate(14);

      if (busted) {
        loadLevel(currentLevelIndex);
        return;
      }

      if (levelCleared) {
        loadLevel(currentLevelIndex + 1);
        return;
      }

      // 1. UNPOSSESS / EJECT
      if (player.isPossessing) {
        const furn = player.possessedFurniture;
        if (furn) {
          furn.x = player.x;
          furn.y = player.y;
          furn.isPossessed = false;
        }
        player.isPossessing = false;
        player.possessedFurniture = null;

        audio.playUnpossess();
        spawnPoofParticles(player.x, player.y, '#9d4edd');
        floatingTexts.push({
          text: "EJECTED!",
          x: player.x,
          y: player.y - 14,
          life: 0.8,
          color: "#00f0ff"
        });
      } 
      // 2. POSSESS NEAREST FURNITURE (Intelligent 48px Proximity Fallback)
      else {
        let targetFurn = closestFurniture;
        
        // Search if not cached
        if (!targetFurn) {
          let minDist = 48;
          furnitureList.forEach(furn => {
            const d = Math.hypot(player.x - furn.x, player.y - furn.y);
            if (d < minDist) {
              targetFurn = furn;
              minDist = d;
            }
          });
        }

        if (targetFurn) {
          player.isPossessing = true;
          player.possessedFurniture = targetFurn;
          targetFurn.isPossessed = true;
          player.x = targetFurn.x;
          player.y = targetFurn.y;

          audio.playPossess();
          spawnPoofParticles(player.x, player.y, '#39ff14');
          floatingTexts.push({
            text: `POSSESSED ${targetFurn.type.toUpperCase()}!`,
            x: player.x,
            y: player.y - 14,
            life: 0.9,
            color: "#39ff14"
          });
        } else {
          floatingTexts.push({
            text: "GET NEAR FURNITURE!",
            x: player.x,
            y: player.y - 14,
            life: 0.6,
            color: "#f6c90e"
          });
        }
      }

      updateUI();
    }

    /* ==========================================================================
       NPC VISION CONE DETECTION (STEALTH CHECK)
       ========================================================================== */
    function isPlayerSpottedByAnyNPC() {
      if (player.isPossessing) {
        return false;
      }

      for (const npc of npcs) {
        const dx = player.x - npc.x;
        const dy = player.y - npc.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= npc.visionLength) {
          const npcAngle = npc.visionAngleFacing;
          const angleToPlayer = Math.atan2(dy, dx);
          
          let diff = angleToPlayer - npcAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          if (Math.abs(diff) <= npc.visionAngle) {
            return true;
          }
        }
      }
      return false;
    }

    /* ==========================================================================
       PARTICLES & VISUAL EFFECTS
       ========================================================================== */
    function triggerScreenShake(intensity = 6, duration = 0.22) {
      shakeIntensity = intensity;
      shakeDuration = duration;
    }

    function spawnPoofParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.4;
        const speed = 30 + Math.random() * 60;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2.5 + Math.random() * 3.5,
          color: color,
          life: 0.4 + Math.random() * 0.3,
          maxLife: 0.7
        });
      }
    }

    function spawnSlimeParticles(x, y, color, points) {
      const count = 20;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = 45 + Math.random() * 90;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2.5 + Math.random() * 4,
          color: color,
          life: 0.4 + Math.random() * 0.35,
          maxLife: 0.75
        });
      }

      floatingTexts.push({
        text: `+${points} CLEAN!`,
        x: x,
        y: y - 12,
        life: 0.85,
        color: color
      });
    }

    /* ==========================================================================
       MAIN GAME LOOP & UPDATE SYSTEM
       ========================================================================== */
    let lastTimestamp = performance.now();

    function update(dt) {
      gameTime += dt;

      // Update Screen Shake
      if (shakeDuration > 0) {
        shakeDuration -= dt;
        if (shakeDuration <= 0) {
          shakeIntensity = 0;
        }
      }

      if (busted || levelCleared) {
        return;
      }

      // 1. UPDATE MULTI-NPC PATROL AI
      npcs.forEach(npc => {
        if (npc.state === 'patrolling') {
          if (npc.currentPath && npc.pathIndex < npc.currentPath.length) {
            const nextStep = npc.currentPath[npc.pathIndex];
            const targetX = (nextStep.x + 0.5) * TILE_SIZE;
            const targetY = (nextStep.y + 0.5) * TILE_SIZE;

            const dx = targetX - npc.x;
            const dy = targetY - npc.y;
            const dist = Math.hypot(dx, dy);

            npc.direction = nextStep.dir;
            npc.targetVisionAngle = getAngleForDirection(nextStep.dir);

            const stepDist = npc.speed * dt;
            if (dist <= stepDist) {
              npc.x = targetX;
              npc.y = targetY;
              npc.pathIndex++;
            } else {
              npc.x += (dx / dist) * stepDist;
              npc.y += (dy / dist) * stepDist;
            }

            npc.walkFrame += dt * 7.5;
          } else {
            npc.state = 'inspecting';
            npc.inspectTimer = 1.4 + Math.random() * 1.2;
            npc.inspectPhase = 0;
          }
        } else if (npc.state === 'inspecting') {
          npc.inspectTimer -= dt;
          npc.inspectPhase += dt * 3.2;

          const baseAngle = getAngleForDirection(npc.direction);
          npc.targetVisionAngle = baseAngle + Math.sin(npc.inspectPhase) * 0.9;

          if (npc.inspectTimer <= 0) {
            pickNextNPCDestination(npc);
          }
        }

        // Smoothly interpolate Vision Cone Facing Angle
        let angleDiff = npc.targetVisionAngle - npc.visionAngleFacing;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        npc.visionAngleFacing += angleDiff * Math.min(1, 10 * dt);
      });

      // 2. CHECK NPC FLASHLIGHT VISION & PANIC METER
      const spotted = isPlayerSpottedByAnyNPC();

      if (spotted) {
        panicMeter += 70 * dt;
        audio.playPanicAlert();
        triggerScreenShake(3.5, 0.1);

        if (panicMeter >= 100) {
          panicMeter = 100;
          busted = true;
          audio.playBusted();
          triggerScreenShake(14, 0.6);
        }
      } else {
        if (panicMeter > 0) {
          panicMeter = Math.max(0, panicMeter - 26 * dt);
        }
      }

      // 3. COMBINE JOYSTICK & KEYBOARD INPUT FOR 360-DEGREE MOVEMENT
      let moveX = 0;
      let moveY = 0;

      if (inputVector.active) {
        moveX = inputVector.x;
        moveY = inputVector.y;
      } else {
        if (keyboardKeys.up) moveY -= 1;
        if (keyboardKeys.down) moveY += 1;
        if (keyboardKeys.left) moveX -= 1;
        if (keyboardKeys.right) moveX += 1;
      }

      const inputLength = Math.hypot(moveX, moveY);
      player.isMoving = (inputLength > 0.05);

      const currentSpeed = player.isPossessing ? (player.baseSpeed * 0.65) : player.baseSpeed;

      if (player.isMoving) {
        const normX = (moveX / (inputLength > 1 ? inputLength : 1)) * currentSpeed * dt;
        const normY = (moveY / (inputLength > 1 ? inputLength : 1)) * currentSpeed * dt;

        if (Math.abs(moveX) > Math.abs(moveY)) {
          player.direction = moveX > 0 ? 'right' : 'left';
        } else {
          player.direction = moveY > 0 ? 'down' : 'up';
        }

        const targetX = player.x + normX;
        if (!checkWallCollision(targetX, player.y, player.radius)) {
          player.x = targetX;
        } else if (gameTime - player.lastBumpSound > 0.25) {
          audio.playBump();
          player.lastBumpSound = gameTime;
        }

        const targetY = player.y + normY;
        if (!checkWallCollision(player.x, targetY, player.radius)) {
          player.y = targetY;
        } else if (gameTime - player.lastBumpSound > 0.25) {
          audio.playBump();
          player.lastBumpSound = gameTime;
        }

        player.mopAngle = Math.sin(gameTime * 14) * 0.4;
      } else {
        player.mopAngle = 0;
      }

      // Sync Possessed Furniture Location
      if (player.isPossessing && player.possessedFurniture) {
        player.possessedFurniture.x = player.x;
        player.possessedFurniture.y = player.y;
      }

      // Update Nearest Furniture for Interaction Prompts (48px radius)
      closestFurniture = null;
      if (!player.isPossessing) {
        let minDist = 48;
        furnitureList.forEach(furn => {
          const d = Math.hypot(player.x - furn.x, player.y - furn.y);
          if (d < minDist) {
            closestFurniture = furn;
            minDist = d;
          }
        });
      }

      player.floatOffset = Math.sin(gameTime * 4) * 3;
      player.tailFrame = Math.floor((gameTime * 8) % 4);

      // 4. CLEANING SLIME SPOTS
      for (let i = slimes.length - 1; i >= 0; i--) {
        const slime = slimes[i];
        const dist = Math.hypot(player.x - slime.x, player.y - slime.y);
        
        if (dist < player.radius + slime.radius + (player.isPossessing ? 6 : 2)) {
          score += slime.points;
          triggerScreenShake(7, 0.25);
          spawnSlimeParticles(slime.x, slime.y, slime.color, slime.points);
          audio.playSlimeClean();
          slimes.splice(i, 1);

          // Check Level Completion
          if (score >= currentLevel.totalSlimes && !levelCleared) {
            levelCleared = true;
            audio.playVictory();
            triggerScreenShake(10, 0.4);
          }
        }
      }

      // 5. UPDATE SMOOTH CAMERA VIEWPORT TRACKING
      const mapPixelWidth = currentLevel.cols * TILE_SIZE;
      const mapPixelHeight = currentLevel.rows * TILE_SIZE;

      camera.targetX = player.x - CANVAS_VIEWPORT_SIZE / 2;
      camera.targetY = player.y - CANVAS_VIEWPORT_SIZE / 2;

      // Clamp camera to map bounds
      camera.targetX = Math.max(0, Math.min(camera.targetX, mapPixelWidth - CANVAS_VIEWPORT_SIZE));
      camera.targetY = Math.max(0, Math.min(camera.targetY, mapPixelHeight - CANVAS_VIEWPORT_SIZE));

      // Smooth camera interpolation
      camera.x += (camera.targetX - camera.x) * Math.min(1, 10 * dt);
      camera.y += (camera.targetY - camera.y) * Math.min(1, 10 * dt);

      // 6. PARTICLES & FLOATING TEXTS
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 24 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      updateUI();
    }

    /* ==========================================================================
       RENDER SYSTEM (8-Bit Retro Graphics with Camera Viewport)
       ========================================================================== */
    function drawMap() {
      const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
      const endCol = Math.min(currentLevel.cols - 1, Math.ceil((camera.x + CANVAS_VIEWPORT_SIZE) / TILE_SIZE));
      const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
      const endRow = Math.min(currentLevel.rows - 1, Math.ceil((camera.y + CANVAS_VIEWPORT_SIZE) / TILE_SIZE));

      for (let y = startRow; y <= endRow; y++) {
        for (let x = startCol; x <= endCol; x++) {
          const tile = levelMap[y][x];
          const px = Math.floor(x * TILE_SIZE - camera.x);
          const py = Math.floor(y * TILE_SIZE - camera.y);

          if (tile === TILE.WALL) {
            ctx.fillStyle = '#261447';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

            ctx.fillStyle = '#160b29';
            ctx.fillRect(px, py, TILE_SIZE, 2);
            ctx.fillRect(px, py + 16, TILE_SIZE, 2);
            ctx.fillRect(px + ((y % 2 === 0) ? 16 : 8), py, 2, 16);
            ctx.fillRect(px + ((y % 2 === 0) ? 8 : 24), py + 16, 2, 16);

            ctx.fillStyle = '#3f256e';
            ctx.fillRect(px + 2, py + 2, 12, 12);
            ctx.fillRect(px + 18, py + 18, 12, 12);
          } else if (tile === TILE.PILLAR) {
            ctx.fillStyle = '#140c26';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

            ctx.fillStyle = '#492276';
            ctx.beginPath();
            ctx.arc(px + 16, py + 16, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#7938b8';
            ctx.beginPath();
            ctx.arc(px + 14, py + 14, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.arc(px + 13, py + 13, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            const isAlt = (x + y) % 2 === 0;
            ctx.fillStyle = isAlt ? '#130d24' : '#19112e';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

            ctx.fillStyle = isAlt ? '#1a1230' : '#1f1538';
            ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);

            ctx.fillStyle = '#261b42';
            ctx.fillRect(px + 8, py + 8, 2, 2);
            ctx.fillRect(px + 24, py + 24, 2, 2);
          }
        }
      }

      // Draw Room Labels on Ground
      currentLevel.rooms.forEach(room => {
        const rx = ((room.x1 + room.x2) / 2 + 0.5) * TILE_SIZE - camera.x;
        const ry = (room.y1 + 1.2) * TILE_SIZE - camera.y;
        if (rx >= -100 && rx <= CANVAS_VIEWPORT_SIZE + 100 && ry >= -50 && ry <= CANVAS_VIEWPORT_SIZE + 50) {
          ctx.save();
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = 'rgba(157, 78, 221, 0.35)';
          ctx.textAlign = 'center';
          ctx.fillText(room.name.toUpperCase(), Math.floor(rx), Math.floor(ry));
          ctx.restore();
        }
      });
    }

    function drawSlimes() {
      slimes.forEach(slime => {
        const sx = slime.x - camera.x;
        const sy = slime.y - camera.y;

        if (sx < -30 || sx > CANVAS_VIEWPORT_SIZE + 30 || sy < -30 || sy > CANVAS_VIEWPORT_SIZE + 30) {
          return;
        }

        const pulse = Math.sin(gameTime * slime.bubbleSpeed + slime.bubblePhase) * 1.6;
        const r = slime.radius + pulse;

        // Outer Ecto Glow
        ctx.fillStyle = slime.type === 'purple' ? 'rgba(247, 37, 133, 0.22)' : (slime.type === 'cyan' ? 'rgba(0, 240, 255, 0.25)' : 'rgba(46, 204, 113, 0.22)');
        ctx.beginPath();
        ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = slime.type === 'purple' ? '#b5179e' : (slime.type === 'cyan' ? '#0077b6' : '#27ae60');
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = slime.color;
        ctx.beginPath();
        ctx.arc(sx - 1, sy - 1, r * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx - r * 0.35, sy - r * 0.35, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(Math.floor(sx - r * 0.4), Math.floor(sy - r * 0.4), 2, 2);
      });
    }

    function drawFurnitureItem(furn) {
      const x = furn.x - camera.x;
      const y = furn.y - camera.y;

      if (x < -40 || x > CANVAS_VIEWPORT_SIZE + 40 || y < -40 || y > CANVAS_VIEWPORT_SIZE + 40) {
        return;
      }

      // Proximity Indicator & Floating POSSESS Prompt
      if (furn === closestFurniture && !player.isPossessing) {
        ctx.save();
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(x - 18, y - 18, 36, 36);
        ctx.setLineDash([]);

        // Interactive Prompt Badge
        const bob = Math.sin(gameTime * 6) * 3;
        ctx.fillStyle = 'rgba(10, 5, 24, 0.9)';
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 1;
        ctx.fillRect(x - 30, y - 28 + bob, 60, 12);
        ctx.strokeRect(x - 30, y - 28 + bob, 60, 12);

        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillStyle = '#39ff14';
        ctx.textAlign = 'center';
        ctx.fillText('[POSSESS]', x, y - 20 + bob);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(Math.floor(x), Math.floor(y));

      // Possessed Ectoplasmic Aura & Ghost Float
      if (furn.isPossessed) {
        const floatY = Math.sin(gameTime * 6) * 3;
        ctx.translate(0, floatY);

        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 14;

        // Glowing Ectoplasm Shield
        ctx.fillStyle = 'rgba(57, 255, 20, 0.2)';
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      switch (furn.type) {
        case 'chair':
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(-8, -10, 16, 6);
          ctx.fillStyle = '#A0522D';
          ctx.fillRect(-7, -4, 14, 10);
          ctx.fillStyle = '#5c2c16';
          ctx.fillRect(-7, 6, 3, 5);
          ctx.fillRect(4, 6, 3, 5);
          break;

        case 'lamp':
          ctx.fillStyle = '#f39c12';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(-9, -2);
          ctx.lineTo(9, -2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(0, -2, 5, 0, Math.PI);
          ctx.fill();
          ctx.fillStyle = '#d35400';
          ctx.fillRect(-2, -2, 4, 12);
          ctx.fillRect(-6, 8, 12, 3);
          break;

        case 'armchair':
          ctx.fillStyle = '#6c1d45';
          ctx.fillRect(-12, -9, 24, 18);
          ctx.fillStyle = '#9b2242';
          ctx.fillRect(-9, -6, 18, 13);
          ctx.fillStyle = '#4a1230';
          ctx.fillRect(-13, -5, 4, 13);
          ctx.fillRect(9, -5, 4, 13);
          break;

        case 'clock':
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(-8, -14, 16, 28);
          ctx.fillStyle = '#fff8e1';
          ctx.beginPath();
          ctx.arc(0, -7, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#212121';
          ctx.fillRect(0, -7, 1, -5);
          ctx.fillRect(0, -7, 4, 1);
          ctx.fillStyle = '#fbc02d';
          const pend = Math.sin(gameTime * 4) * 3;
          ctx.beginPath();
          ctx.arc(pend, 6, 2.5, 0, Math.PI * 2);
          ctx.fill();
          break;

        case 'table':
          ctx.fillStyle = '#5c3a21';
          ctx.fillRect(-14, -8, 28, 16);
          ctx.fillStyle = '#7a4e2d';
          ctx.fillRect(-12, -6, 24, 12);
          ctx.fillStyle = '#3d2514';
          ctx.fillRect(-12, 6, 4, 6);
          ctx.fillRect(8, 6, 4, 6);
          ctx.fillRect(-12, -12, 4, 5);
          ctx.fillRect(8, -12, 4, 5);
          break;

        case 'mirror_cabinet':
          ctx.fillStyle = '#3d2618';
          ctx.fillRect(-12, -14, 24, 28);
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(-9, -11, 18, 22);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.fillRect(-7, -9, 4, 18);
          break;

        case 'piano':
          ctx.fillStyle = '#111';
          ctx.fillRect(-16, -10, 32, 20);
          ctx.fillStyle = '#fff';
          ctx.fillRect(-14, 2, 28, 6);
          ctx.fillStyle = '#000';
          for (let k = -12; k <= 10; k += 4) {
            ctx.fillRect(k, 2, 2.5, 4);
          }
          break;
      }

      // Possessed Glowing Ghost Eyes
      if (furn.isPossessed) {
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-4, -4, 3, 3);
        ctx.fillRect(2, -4, 3, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-3, -3, 1, 1);
        ctx.fillRect(3, -3, 1, 1);
      }

      ctx.restore();
    }

    function drawGhostJanitor() {
      if (player.isPossessing) {
        return;
      }

      const drawX = Math.floor(player.x - camera.x);
      const drawY = Math.floor(player.y + player.floatOffset - camera.y);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 240, 255, 0.18)';
      ctx.beginPath();
      ctx.arc(drawX, drawY, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d8f3dc';
      ctx.beginPath();
      ctx.arc(drawX, drawY - 2, 9, Math.PI, 0, false);
      ctx.lineTo(drawX + 9, drawY + 6);

      const tFrame = player.tailFrame;
      ctx.lineTo(drawX + 5, drawY + 8 + (tFrame === 0 ? 2 : 0));
      ctx.lineTo(drawX + 1, drawY + 5);
      ctx.lineTo(drawX - 3, drawY + 8 + (tFrame === 2 ? 2 : 0));
      ctx.lineTo(drawX - 9, drawY + 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(drawX - 2, drawY - 4, 6, Math.PI, 0, false);
      ctx.fill();

      let eyeOffsetX = 0;
      let eyeOffsetY = 0;
      if (player.direction === 'left') eyeOffsetX = -2;
      if (player.direction === 'right') eyeOffsetX = 2;
      if (player.direction === 'up') eyeOffsetY = -2;
      if (player.direction === 'down') eyeOffsetY = 1;

      ctx.fillStyle = '#0a0818';
      ctx.fillRect(drawX - 5 + eyeOffsetX, drawY - 3 + eyeOffsetY, 2.5, 3);
      ctx.fillRect(drawX + 2 + eyeOffsetX, drawY - 3 + eyeOffsetY, 2.5, 3);

      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(drawX - 4 + eyeOffsetX, drawY - 3 + eyeOffsetY, 1, 1);
      ctx.fillRect(drawX + 3 + eyeOffsetX, drawY - 3 + eyeOffsetY, 1, 1);

      // Janitor Cap
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(drawX - 6, drawY - 10, 12, 3);
      ctx.fillRect(drawX - 4, drawY - 13, 8, 3);
      ctx.fillStyle = '#222';
      ctx.fillRect(drawX + (player.direction === 'left' ? -7 : 1), drawY - 10, 6, 1.5);

      // Janitor Mop
      ctx.save();
      ctx.translate(drawX + 7, drawY + 2);
      ctx.rotate(player.mopAngle);

      ctx.strokeStyle = '#d4a373';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-2, -10);
      ctx.lineTo(4, 10);
      ctx.stroke();

      ctx.fillStyle = '#ced4da';
      ctx.fillRect(2, 8, 6, 5);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(3, 11, 2, 2);

      ctx.restore();
      ctx.restore();
    }

    function drawPatrollingNPC(npc) {
      const hx = Math.floor(npc.x - camera.x);
      const hy = Math.floor(npc.y - camera.y);

      if (hx < -180 || hx > CANVAS_VIEWPORT_SIZE + 180 || hy < -180 || hy > CANVAS_VIEWPORT_SIZE + 180) {
        return;
      }

      // Flashlight Vision Cone
      ctx.save();
      const vFacing = npc.visionAngleFacing;
      const vAngle = npc.visionAngle;
      const vLen = npc.visionLength;

      const leftAngle = vFacing - vAngle;
      const rightAngle = vFacing + vAngle;

      const coneGrad = ctx.createRadialGradient(hx, hy, 4, hx, hy, vLen);
      coneGrad.addColorStop(0, 'rgba(255, 240, 150, 0.48)');
      coneGrad.addColorStop(0.7, 'rgba(255, 230, 100, 0.22)');
      coneGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');

      ctx.fillStyle = coneGrad;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.arc(hx, hy, vLen, leftAngle, rightAngle);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 240, 150, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + Math.cos(leftAngle) * vLen, hy + Math.sin(leftAngle) * vLen);
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + Math.cos(rightAngle) * vLen, hy + Math.sin(rightAngle) * vLen);
      ctx.stroke();
      ctx.restore();

      // NPC Body
      ctx.save();
      ctx.translate(hx, hy);

      const legBob = Math.sin(npc.walkFrame) * 2.5;

      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(-5, 4 + (legBob > 0 ? legBob : 0), 4, 7);
      ctx.fillRect(1, 4 + (legBob < 0 ? -legBob : 0), 4, 7);

      ctx.fillStyle = npc.id === 0 ? '#8e44ad' : '#2980b9';
      ctx.fillRect(-7, -5, 14, 10);
      ctx.fillStyle = npc.id === 0 ? '#9b59b6' : '#3498db';
      ctx.fillRect(-5, -4, 10, 8);

      ctx.fillStyle = '#f1c27d';
      ctx.beginPath();
      ctx.arc(0, -9, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5c3d2e';
      ctx.fillRect(-6, -15, 12, 4);

      let eyeX = 0;
      let eyeY = 0;
      if (npc.direction === 'left') eyeX = -2;
      if (npc.direction === 'right') eyeX = 2;
      if (npc.direction === 'up') eyeY = -2;
      if (npc.direction === 'down') eyeY = 1;

      ctx.fillStyle = '#000';
      ctx.fillRect(-3 + eyeX, -10 + eyeY, 1.5, 2);
      ctx.fillRect(1 + eyeX, -10 + eyeY, 1.5, 2);

      // Flashlight In Hand
      ctx.fillStyle = '#34495e';
      const flashDirX = Math.cos(npc.visionAngleFacing);
      const flashDirY = Math.sin(npc.visionAngleFacing);
      ctx.fillRect(flashDirX * 6 - 2, flashDirY * 6 - 2, 4, 4);

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        const px = p.x - camera.x;
        const py = p.y - camera.y;
        if (px < -10 || px > CANVAS_VIEWPORT_SIZE + 10 || py < -10 || py > CANVAS_VIEWPORT_SIZE + 10) return;

        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(Math.floor(px - p.size / 2), Math.floor(py - p.size / 2), Math.floor(p.size), Math.floor(p.size));
      });
      ctx.globalAlpha = 1.0;
    }

    function drawFloatingTexts() {
      floatingTexts.forEach(ft => {
        const fx = ft.x - camera.x;
        const fy = ft.y - camera.y;
        ctx.save();
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = ft.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, Math.floor(fx), Math.floor(fy));
        ctx.restore();
      });
    }

    function drawOverlays() {

        ctx.textAlign = 'center';
        const pulse = 1 + Math.sin(gameTime * 6) * 0.06;

        ctx.font = '22px "Press Start 2P", monospace';

        ctx.shadowColor = '#ff0055';

        const blink = Math.floor(gameTime * 2.5) % 2 === 0;

      if (levelCleared) {
        ctx.fillStyle = 'rgba(10, 5, 24, 0.92)';
