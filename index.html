<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ghost Janitor - 8-Bit Game Boy Arcade</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="description" content="Retro 8-Bit Game Boy arcade puzzle game. Possess cleaning tools, tidy haunted multi-room mansions, and defeat rogue dust phantoms!">
  <meta name="theme-color" content="#231b38">
  <meta name="background-color" content="#0d0818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghost Janitor">
  <meta name="application-name" content="Ghost Janitor">
  <meta name="msapplication-TileColor" content="#231b38">
  <meta name="msapplication-config" content="browserconfig.xml">

  <!-- Manifest Links -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="manifest" href="manifest.json">

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --gb-body: #231b38;
      --gb-body-dark: #150f24;
      --gb-bezel: #0d0818;
      --gb-accent-purple: #9d4edd;
      --gb-accent-pink: #f72585;
      --gb-accent-cyan: #00f0ff;
      --gb-accent-green: #39ff14;
      --gb-accent-gold: #f6c90e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b1035 0%, #080410 100%);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* Main Game Boy Handheld Chassis */
    .gameboy-console {
      position: relative;
      background: linear-gradient(170deg, #2e214c 0%, #1a1230 65%, #120b22 100%);
      border-radius: 24px 24px 34px 24px;
      padding: 8px 12px 12px;
      box-shadow: 
        0 0 35px rgba(157, 78, 221, 0.35),
        0 15px 35px rgba(0, 0, 0, 0.9),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -5px 10px rgba(0, 0, 0, 0.8);
      border: 3px solid #4a3473;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      max-height: 98dvh;
      margin: auto;
    }

    /* Game Boy Top Header Bar */
    .gb-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px 4px;
      border-bottom: 2px solid #3c2a63;
      margin-bottom: 4px;
    }

    .gb-grooves {
      display: flex;
      gap: 3px;
    }

    .gb-groove-line {
      width: 16px;
      height: 3px;
      background: #140d24;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .gb-logo-brand {
      font-size: 0.58rem;
      color: #00f0ff;
      letter-spacing: 1.2px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 15px #f72585;
      font-style: italic;
    }

    .hud-pts-badge {
      font-size: 0.42rem;
      color: #f6c90e;
      background: #201335;
      border: 1px solid #f6c90e;
      border-radius: 4px;
      padding: 2px 5px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .pwa-install-btn {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.36rem;
      background: linear-gradient(135deg, #f72585, #7209b7);
      color: #fff;
      border: 1px solid #ff70a6;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(247, 37, 133, 0.6);
      animation: pulseInstall 2s infinite ease-in-out;
      touch-action: manipulation;
    }
    @keyframes pulseInstall {
      0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(247, 37, 133, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 12px rgba(247, 37, 133, 0.9); }
    }

    .power-led-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .power-led-label {
      font-size: 0.38rem;
      color: #8c72b0;
      letter-spacing: 0.5px;
    }

    .power-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #39ff14;
      box-shadow: 0 0 8px #39ff14, inset 0 0 2px #fff;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .power-led.panic {
      background: #ff0055;
      box-shadow: 0 0 10px #ff0055;
      animation: blinkLed 0.25s infinite alternate;
    }

    @keyframes blinkLed {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Screen Bezel Area */
    .gb-screen-bezel {
      background: #110b20;
      border: 3px solid #0a0614;
      border-radius: 12px;
      padding: 6px 6px 5px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 
        inset 0 3px 6px rgba(0, 0, 0, 0.9),
        0 2px 4px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .bezel-top-deco {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .bezel-deco-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #ff0077, #9d4edd, #00f0ff);
      border-radius: 2px;
    }

    .bezel-title {
      font-size: 0.38rem;
      color: #9d4edd;
      margin: 0 6px;
      letter-spacing: 1px;
    }

    /* Compact Integrated HUD */
    .gb-hud {
      width: 100%;
      background: rgba(10, 6, 20, 0.92);
      border: 1px solid #4a3473;
      border-radius: 6px;
      padding: 4px 6px;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.48rem;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .hud-left-stats {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-floor-badge {
      font-size: 0.42rem;
      color: #f6c90e;
      background: #2b1842;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #8e44ad;
      letter-spacing: 0.5px;
    }

    .hud-cleanliness {
      color: #39ff14;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.6);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .hud-stealth-pill {
      font-size: 0.38rem;
      padding: 2px 5px;
      border-radius: 4px;
      background: #1e1438;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .hud-stealth-pill.hidden {
      border-color: #39ff14;
      color: #39ff14;
      background: #0f3d1f;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.8);
      animation: stealthGlow 1.2s infinite alternate;
    }

    .hud-stealth-pill.tool-mode {
      border-color: #f72585;
      color: #ff0077;
      background: #3b0a24;
      box-shadow: 0 0 8px rgba(247, 37, 133, 0.8);
    }

    .hud-time-pill {
      font-size: 0.38rem;
      padding: 2px 5px;
      border-radius: 3px;
      background: #331500;
      border: 1px solid #ff7700;
      color: #ffaa00;
      display: none;
    }

    .hud-time-pill.urgent {
      background: #4a000f;
      border-color: #ff0055;
      color: #ff0055;
      animation: pulseInspect 0.5s infinite alternate;
    }

    @keyframes pulseInspect {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    @keyframes stealthGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    .panic-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      max-width: 150px;
    }

    .panic-bar-outer {
      flex: 1;
      height: 8px;
      background: #180d26;
      border: 1px solid #ff0055;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .panic-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc00, #ff0055);
      transition: width 0.1s linear;
      box-shadow: 0 0 8px #ff0055;
    }

    .panic-bar-inner.warning {
      animation: panicPulse 0.3s infinite alternate;
    }

    @keyframes panicPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.6); }
    }

    .hud-room-tag {
      font-size: 0.38rem;
      color: #00f0ff;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
      letter-spacing: 0.5px;
    }

    /* Screen Bezel & Canvas wrapper */
    .screen-container {
      position: relative;
      background: #000;
      border: 2px solid #2e1d4d;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95);
    }

    .screen-container::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.32) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 255, 0, 0.03)
      );
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
      z-index: 10;
    }

    .screen-container::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 70%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .panic-alert-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      box-shadow: inset 0 0 50px rgba(255, 0, 85, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transition: opacity 0.15s ease-in-out;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      max-width: min(88vw, 360px, 42vh);
      aspect-ratio: 1 / 1;
      height: auto;
      background-color: #0d091a;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CONTROLS DECK: JOYSTICK + ARCADE BUTTONS */
    .gb-controls-deck {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      gap: 8px;
    }

    /* JOYSTICK */
    .joystick-zone {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .joystick-base {
      position: relative;
      width: 104px;
      height: 104px;
      background: radial-gradient(circle at 40% 40%, #2a1b47 0%, #120b22 70%, #080410 100%);
      border-radius: 50%;
      border: 3px solid #5a3c8c;
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.15),
        inset 0 -4px 8px rgba(0, 0, 0, 0.85),
        0 6px 12px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: grab;
    }

    .joystick-ring-deco {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px dashed rgba(157, 78, 221, 0.4);
      pointer-events: none;
    }

    .joystick-indicator {
      position: absolute;
      font-size: 0.5rem;
      color: rgba(157, 78, 221, 0.65);
      pointer-events: none;
      transition: color 0.1s, transform 0.1s;
    }
    .joystick-indicator.up { top: 4px; }
    .joystick-indicator.down { bottom: 4px; }
    .joystick-indicator.left { left: 5px; }
    .joystick-indicator.right { right: 5px; }

    .joystick-indicator.lit {
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
      transform: scale(1.3);
    }

    .joystick-knob {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #9d4edd 0%, #4a127a 60%, #1b072e 100%);
      border: 2px solid #b872ff;
      box-shadow: 
        0 5px 10px rgba(0, 0, 0, 0.9),
        0 0 12px rgba(157, 78, 221, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.4),
        inset 0 -3px 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      transition: transform 0.05s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joystick-knob-core {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f0ff 0%, #7209b7 100%);
      border: 1px solid #00f0ff;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    .joystick-knob.active {
      box-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 240, 255, 0.95),
        inset 0 2px 5px rgba(255, 255, 255, 0.7);
      border-color: #00f0ff;
    }

    /* 4 ARCADE BUTTONS DECK */
    .gb-arcade-buttons-deck {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 8px;
      background: linear-gradient(145deg, #1b122e 0%, #0d0818 100%);
      padding: 6px 8px;
      border-radius: 20px;
      border: 1.5px solid #3c295c;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08), 0 4px 10px rgba(0, 0, 0, 0.7);
    }

    .arcade-btn-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .arcade-custom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      transition: all 0.08s ease;
      touch-action: none;
      position: relative;
      outline: none;
    }

    .btn-top-icon {
      font-size: 0.75rem;
      line-height: 1;
      margin-bottom: 2px;
      pointer-events: none;
    }

    .btn-main-text {
      font-size: 0.32rem;
      letter-spacing: 0.5px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 1. POSSESS BUTTON */
    .btn-possess-style {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f72585, #7209b7);
      border: 2px solid #ff70a6;
      box-shadow: 0 3px 0 #3a001a, 0 0 12px rgba(247, 37, 133, 0.6);
      color: #fff;
    }
    .btn-possess-style:active, .btn-possess-style.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3a001a, 0 0 18px rgba(247, 37, 133, 1);
      background: #ff0055;
    }
    .btn-possess-style.eject-mode {
      background: linear-gradient(145deg, #39ff14, #0f7a28);
      border-color: #a8ff78;
      box-shadow: 0 3px 0 #053310, 0 0 14px rgba(57, 255, 20, 0.7);
    }

    /* 2. TRAP DECOY BUTTON */
    .btn-trap-style {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e67e22, #b94a00);
      border: 2px solid #ffaa44;
      box-shadow: 0 3px 0 #3a1500, 0 0 10px rgba(230, 126, 34, 0.5);
      color: #fff;
    }
    .btn-trap-style:active, .btn-trap-style.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3a1500, 0 0 16px rgba(230, 126, 34, 0.9);
      background: #ff9900;
    }

    /* 3. SHOP / START BUTTON */
    .btn-shop-style {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #9d4edd, #4a0e78);
      border: 2px solid #cc88ff;
      box-shadow: 0 3px 0 #24053d, 0 0 10px rgba(157, 78, 221, 0.5);
      color: #fff;
    }
    .btn-shop-style:active, .btn-shop-style.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #24053d, 0 0 16px rgba(157, 78, 221, 0.9);
      background: #b055ff;
    }

    /* 4. MUSIC / SOUND TOGGLE BUTTON */
    .btn-music-style {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #00f0ff, #0077b6);
      border: 2px solid #80f7ff;
      box-shadow: 0 3px 0 #00375b, 0 0 10px rgba(0, 240, 255, 0.5);
      color: #fff;
    }
    .btn-music-style:active, .btn-music-style.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #00375b, 0 0 16px rgba(0, 240, 255, 0.9);
      background: #48cae4;
    }
    .btn-music-style.muted {
      background: linear-gradient(145deg, #555, #222);
      border-color: #888;
      box-shadow: 0 3px 0 #111;
      opacity: 0.6;
    }

    .btn-sub-label {
      font-size: 0.32rem;
      color: #8c72b0;
      letter-spacing: 0.5px;
    }

    /* UNDERWORLD SHOP MODAL OVERLAY */
    .shop-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 8, 24, 0.96);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 12px;
      border-radius: 6px;
      border: 2px solid #9d4edd;
      box-shadow: inset 0 0 30px rgba(157, 78, 221, 0.4);
      overflow-y: auto;
    }

    .shop-modal.open {
      display: flex;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #4a3473;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .shop-title {
      font-size: 0.55rem;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff;
    }

    .shop-clerk-banner {
      background: #1e1136;
      border: 1px solid #f6c90e;
      border-radius: 4px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.38rem;
      color: #f6c90e;
      line-height: 1.4;
    }

    .shop-items-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .shop-item-card {
      background: #180f2d;
      border: 1px solid #3c2a63;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .shop-item-card:hover {
      border-color: #00f0ff;
      background: #231640;
    }

    .shop-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .shop-item-name {
      font-size: 0.42rem;
      color: #fff;
    }

    .shop-item-desc {
      font-size: 0.32rem;
      color: #a89bb9;
      line-height: 1.3;
    }

    .shop-item-buy-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      padding: 5px 8px;
      background: linear-gradient(135deg, #f6c90e, #d35400);
      color: #000;
      border: 1px solid #ffe066;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: bold;
    }

    .shop-item-buy-btn.owned {
      background: #1f3d1f;
      color: #39ff14;
      border-color: #39ff14;
      cursor: default;
    }

    .shop-item-buy-btn:disabled:not(.owned) {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .shop-close-btn {
      margin-top: auto;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.48rem;
      padding: 8px;
      background: linear-gradient(135deg, #39ff14, #0f7a28);
      color: #000;
      border: 2px solid #a8ff78;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <main class="gameboy-console" role="region" aria-label="Ghost Janitor Handheld Console">
    <!-- Top Game Boy Header -->

  <script>
    /* ==========================================================================
       8-BIT RETRO CHIPTUNE SOUND SYNTHESIZER & DYNAMIC BGM ENGINE (Web Audio API)
       ========================================================================== */
    class RetroAudioEngine {
      constructor() {
        this.ctx = null;
        this.musicEnabled = true;
        this.sfxEnabled = true;
        this.lastAlertTime = 0;
        this.lastVacuumSoundTime = 0;
        this.lastEMFSoundTime = 0;
        this.lastCreakSoundTime = 0;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.baseTempo = 145;
        this.currentTempo = 145;
        this.isFrantic = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startBGM() {
        if (this.bgmTimer || !this.musicEnabled) return;
        this.init();
        if (!this.ctx) return;

        this.restartBGMInterval();
      }

      restartBGMInterval() {
        if (this.bgmTimer) clearInterval(this.bgmTimer);
        const stepTimeMs = (60 / this.currentTempo / 4) * 1000;
        this.bgmTimer = setInterval(() => {
          this.playBGMStep();
        }, stepTimeMs);
      }

      setPanicTempo(frantic) {
        if (this.isFrantic === frantic) return;
        this.isFrantic = frantic;
        this.currentTempo = frantic ? 210 : 145; // Frantic fast tempo shift on 75%+ Panic!
        if (this.bgmTimer && this.musicEnabled) {
          this.restartBGMInterval();
        }
      }

      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        if (this.musicEnabled) {
          this.init();
          this.startBGM();
        } else {
          this.stopBGM();
        }
        return this.musicEnabled;
      }

      playBGMStep() {
        if (!this.musicEnabled || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const step = this.bgmStep % 32;

        // Chiptune Bassline (Triangle)
        const bassNotes = this.isFrantic ? [
          146.83, 146.83, 174.61, 146.83, 196.00, 174.61, 146.83, 130.81,
          146.83, 146.83, 174.61, 146.83, 220.00, 196.00, 174.61, 164.81,
          146.83, 146.83, 174.61, 146.83, 196.00, 174.61, 146.83, 130.81,
          146.83, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63
        ] : [
          110, 0, 110, 0,  130.81, 0, 110, 0,
          98, 0, 98, 0,   123.47, 0, 98, 0,
          87.31, 0, 87.31, 0, 110, 0, 87.31, 0,
          98, 0, 110, 0,  123.47, 0, 130.81, 146.83
        ];

        const bassFreq = bassNotes[step];
        if (bassFreq > 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(bassFreq, now);
          gain.gain.setValueAtTime(this.isFrantic ? 0.16 : 0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (this.isFrantic ? 0.08 : 0.12));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        }

        // Spooky Lead Melody (Square Wave)
        const leadNotes = this.isFrantic ? [
          587.33, 698.46, 880.00, 783.99, 587.33, 523.25, 587.33, 698.46,
          880.00, 1046.50, 987.77, 880.00, 783.99, 698.46, 783.99, 880.00,
          587.33, 698.46, 880.00, 783.99, 587.33, 523.25, 587.33, 698.46,
          880.00, 783.99, 698.46, 587.33, 523.25, 493.88, 440.00, 392.00
        ] : [
          440, 0, 523.25, 0,  659.25, 0, 587.33, 0,
          440, 0, 392, 0,     440, 0, 0, 0,
          349.23, 0, 440, 0,  523.25, 0, 440, 0,
          392, 0, 440, 0,     493.88, 0, 523.25, 0
        ];

        const leadFreq = leadNotes[step];
        if (leadFreq > 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(leadFreq, now);
          gain.gain.setValueAtTime(this.isFrantic ? 0.06 : 0.045, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (this.isFrantic ? 0.1 : 0.16));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        // 8-bit Noise Hi-Hat / Snare rhythm
        if (step % 2 === 1 || this.isFrantic) {
          this.playNoiseTick(0.03, this.isFrantic ? 0.035 : 0.02);
        }

        this.bgmStep++;
      }

      playNoiseTick(dur, vol) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(4000, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      playSlimeClean() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.16);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);

        const chime = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chime.type = 'sine';
        chime.frequency.setValueAtTime(1300, now + 0.04);
        chime.frequency.exponentialRampToValueAtTime(2100, now + 0.16);

        chimeGain.gain.setValueAtTime(0.18, now + 0.04);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        chime.connect(chimeGain);
        chimeGain.connect(this.ctx.destination);
        chime.start(now + 0.04);
        chime.stop(now + 0.22);
      }

      playBurn() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const dur = 0.28;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (Math.sin(i * 0.04) > 0.3 ? 1 : 0.2);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(3200, now + dur);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      playSqueak() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(980, now);
        osc.frequency.exponentialRampToValueAtTime(2400, now + 0.09);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.16);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playCreak() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastCreakSoundTime < 0.3) return;
        this.lastCreakSoundTime = now;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.16);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playValveTurn() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const freqs = [350, 440, 580, 720];
        freqs.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.06);
          gain.gain.setValueAtTime(0.2, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.13);
        });
      }

      playRoomCleanedChime() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(f, now + i * 0.07);
          gain.gain.setValueAtTime(0.22, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.22);
        });
      }

      playPossess() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      playUnpossess() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      playVacuumHum() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastVacuumSoundTime < 0.14) return;
        this.lastVacuumSoundTime = now;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(95 + Math.random() * 20, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      playSlip() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }

      playDistractionRing() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const freqs = [880, 1174.66, 1760, 1318.51, 1046.50];
        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.18, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.18);
        });
      }

      playEMFBeep() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastEMFSoundTime < 0.18) return;
        this.lastEMFSoundTime = now;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1600, now);
        osc.frequency.exponentialRampToValueAtTime(2400, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playPanicAlert() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (now - this.lastAlertTime < 0.18) return;
        this.lastAlertTime = now;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.setValueAtTime(840, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      playBump() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(85, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playBusted() {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const tones = [420, 350, 260, 180, 120];
        tones.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + i * 0.11);

          gain.gain.setValueAtTime(0.25, now + i * 0.11);

    /* Generate Procedural Multi-Room Grid with Environmental Hazards */
    function generateLevelMap(level) {
      const grid = [];
      const cols = level.cols;
      const rows = level.rows;

      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          if (x === 0 || x === cols - 1 || y === 0 || y === rows - 1) {
            row.push(TILE.WALL);
          } else {
            row.push(TILE.FLOOR);
          }
        }
        grid.push(row);
      }

      // Add room walls
      level.rooms.forEach(room => {
        for (let y = room.y1; y <= room.y2; y++) {
          if (room.x1 > 0 && room.x1 < cols - 1) grid[y][room.x1] = TILE.WALL;
          if (room.x2 > 0 && room.x2 < cols - 1) grid[y][room.x2] = TILE.WALL;
        }
        for (let x = room.x1; x <= room.x2; x++) {
          if (room.y1 > 0 && room.y1 < rows - 1) grid[room.y1][x] = TILE.WALL;
          if (room.y2 > 0 && room.y2 < rows - 1) grid[room.y2][x] = TILE.WALL;
        }
      });

      // Punch wide doorways
      level.rooms.forEach(room => {
        const midX = Math.floor((room.x1 + room.x2) / 2);
        const midY = Math.floor((room.y1 + room.y2) / 2);

        if (room.y1 > 0) {
          grid[room.y1][midX] = TILE.FLOOR;
          if (midX + 1 < cols - 1) grid[room.y1][midX + 1] = TILE.FLOOR;
          if (midX - 1 > 0) grid[room.y1][midX - 1] = TILE.FLOOR;
        }
        if (room.y2 < rows - 1) {
          grid[room.y2][midX] = TILE.FLOOR;
          if (midX + 1 < cols - 1) grid[room.y2][midX + 1] = TILE.FLOOR;
          if (midX - 1 > 0) grid[room.y2][midX - 1] = TILE.FLOOR;
        }
        if (room.x1 > 0) {
          grid[midY][room.x1] = TILE.FLOOR;
          if (midY + 1 < rows - 1) grid[midY + 1][room.x1] = TILE.FLOOR;
          if (midY - 1 > 0) grid[midY - 1][room.x1] = TILE.FLOOR;
        }
        if (room.x2 < cols - 1) {
          grid[midY][room.x2] = TILE.FLOOR;
          if (midY + 1 < rows - 1) grid[midY + 1][room.x2] = TILE.FLOOR;
          if (midY - 1 > 0) grid[midY - 1][room.x2] = TILE.FLOOR;
        }
      });

      // Inject Environmental Hazard Tiles:
      // Floor 1: Flooded Water puddles (reduces movement speed unless pipe valve turned off)
      if (level.theme === 'flooded_basement') {
        level.rooms.forEach((room, rIdx) => {
          if (rIdx % 2 === 1) {
            for (let y = room.y1 + 1; y < room.y2; y++) {
              for (let x = room.x1 + 1; x < room.x2; x++) {
                if (grid[y][x] === TILE.FLOOR && Math.random() < 0.65) {
                  grid[y][x] = TILE.FLOODED;

              }
            }
          }
        });

                if (grid[y][x] === TILE.FLOOR && Math.random() < 0.5) {
                  grid[y][x] = TILE.CREAKY_PLANK;
                }
              }
            }
          }
        });
      }

      // Clear spawn
      const sx = Math.floor(level.spawnX);
      const sy = Math.floor(level.spawnY);
      for (let dy = -1; dy <= 1; dy++) {

            grid[sy + dy][sx + dx] = TILE.FLOOR;
          }
        }
      }

      return grid;
    }

    /* ==========================================================================
       PATHFINDING (BFS on Grid)
       ========================================================================== */
    function isWalkable(gridX, gridY) {
      if (gridX < 0 || gridX >= currentLevel.cols || gridY < 0 || gridY >= currentLevel.rows) return false;
      return levelMap[gridY][gridX] !== TILE.WALL && levelMap[gridY][gridX] !== TILE.PILLAR;
    }

    function checkWallCollision(px, py, radius) {
      const minX = Math.floor((px - radius) / TILE_SIZE);
      const maxX = Math.floor((px + radius) / TILE_SIZE);
      const minY = Math.floor((py - radius) / TILE_SIZE);
      const maxY = Math.floor((py + radius) / TILE_SIZE);

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if (!isWalkable(x, y)) {
            const tileLeft = x * TILE_SIZE;
            const tileTop = y * TILE_SIZE;
            const closestX = Math.max(tileLeft, Math.min(px, tileLeft + TILE_SIZE));
            const closestY = Math.max(tileTop, Math.min(py, tileTop + TILE_SIZE));
            const dx = px - closestX;
            const dy = py - closestY;
            if (dx * dx + dy * dy < radius * radius) return true;
          }
        }
      }
      return false;
    }

    function findBFSPath(startX, startY, targetX, targetY) {
      if (startX === targetX && startY === targetY) return [];
      const queue = [{ x: startX, y: startY, path: [] }];
      const visited = new Set();
      visited.add(`${startX},${startY}`);
      let stepsLimit = 1200;

      while (queue.length > 0 && stepsLimit-- > 0) {
        const current = queue.shift();
        if (current.x === targetX && current.y === targetY) return current.path;

        const neighbors = [
          { x: current.x + 1, y: current.y, dir: 'right' },
          { x: current.x - 1, y: current.y, dir: 'left' },
          { x: current.x, y: current.y + 1, dir: 'down' },
          { x: current.x, y: current.y - 1, dir: 'up' }
        ];

        for (const nb of neighbors) {
          const key = `${nb.x},${nb.y}`;
          if (isWalkable(nb.x, nb.y) && !visited.has(key)) {
            visited.add(key);
            queue.push({ x: nb.x, y: nb.y, path: [...current.path, { x: nb.x, y: nb.y, dir: nb.dir }] });
          }
        }
      }
      return [];
    }

    function getAngleForDirection(dir) {
      switch (dir) {
        case 'right': return 0;
        case 'down': return Math.PI / 2;
        case 'left': return Math.PI;
        case 'up': return -Math.PI / 2;
        default: return 0;
      }
    }

    function getCurrentRoomName(px, py) {
      const gx = Math.floor(px / TILE_SIZE);
      const gy = Math.floor(py / TILE_SIZE);
      for (const room of currentLevel.rooms) {
        if (gx >= room.x1 && gx <= room.x2 && gy >= room.y1 && gy <= room.y2) {

      }
      return "Haunted Hallway";
    }

    function pickNextNPCDestination(npc) {
      let nextIdx = Math.floor(Math.random() * currentLevel.patrolWaypoints.length);
      while (nextIdx === npc.currentWaypointIdx && currentLevel.patrolWaypoints.length > 1) {

      const curGridX = Math.floor(npc.x / TILE_SIZE);
      const curGridY = Math.floor(npc.y / TILE_SIZE);
      npc.currentPath = findBFSPath(curGridX, curGridY, targetWp.x, targetWp.y);
      npc.pathIndex = 0;
      npc.state = 'patrolling';
    }

          category: 'standard_dust',
          points: sPoints,
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE,
          radius: sRadius,
          color: sColor,
          bubblePhase: Math.random() * Math.PI * 2,
          bubbleSpeed: 2.2 + Math.random() * 3
        });
      }

      // 2. Spawn Ectoplasmic Slime (Requires possessed tool or vacuum)
      const ectoCount = currentLevel.totalEctoSlimes || 6;
      for (let i = 0; i < ectoCount && emptyTiles.length > 0; i++) {
        const tile = emptyTiles.pop();
        slimes.push({
          id: 1000 + i,
          type: 'ecto_slime',
          category: 'ecto_slime', // Only cleanable via possessed gear or vacuum
          points: 3,
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE,
          radius: 14,
          color: '#f72585',
          bubblePhase: Math.random() * Math.PI * 2,
          bubbleSpeed: 4.5
        });
      }

      // 3. Spawn Haunted Cobwebs (Require fire tools: Candle / Fire Poker)
      const webCount = currentLevel.totalCobwebs || 6;
      for (let i = 0; i < webCount && emptyTiles.length > 0; i++) {
        const tile = emptyTiles.pop();
        cobwebs.push({
          id: 2000 + i,
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE,
          radius: 16,
          points: 3
        });
      }

      totalTargetScore = slimes.reduce((sum, s) => sum + s.points, 0) + cobwebs.reduce((sum, w) => sum + w.points, 0);
      floorInitialMessSnapshot = totalTargetScore;

      // Spawn NPCs
      currentLevel.npcs.forEach((npcDef, i) => {
        const startWpIdx = (i * 3 + 2) % currentLevel.patrolWaypoints.length;
        const wp = currentLevel.patrolWaypoints[startWpIdx];
        const npc = {
          id: i,
          type: npcDef.type || 'homeowner',
          name: npcDef.name,
          x: (wp.x + 0.5) * TILE_SIZE,
          y: (wp.y + 0.5) * TILE_SIZE,
          radius: npcDef.radius,
          speed: npcDef.speed,
          baseSpeed: npcDef.speed,
          direction: 'down',
          visionAngleFacing: Math.PI / 2,
          targetVisionAngle: Math.PI / 2,
          visionLength: npcDef.visionLength,
          visionAngle: npcDef.visionAngle,
          walkFrame: 0,
          currentPath: [],
          pathIndex: 0,
          currentWaypointIdx: startWpIdx,
          state: 'patrolling',
          inspectTimer: 0,
          inspectPhase: 0,
          slipTimer: 0,
          messTimer: 6 + Math.random() * 4,
          speechText: '',
          speechTimer: 0
        };
        pickNextNPCDestination(npc);
        npcs.push(npc);
      });

      // Center camera
      camera.x = player.x - CANVAS_VIEWPORT_SIZE / 2;
      camera.y = player.y - CANVAS_VIEWPORT_SIZE / 2;

      renderShopItems();
      updateUI();
    }

    function initGame() {
      loadLevel(0);
      audio.startBGM();
    }

      document.getElementById('scoreText').textContent = `${score} / ${totalTargetScore}`;

      const timePill = document.getElementById('timeAttackBadge');

        panicAlert.style.opacity = '0';

      // Stealth State Badge & Possess Button Text

      const btnPossessText = document.getElementById('btnPossessText');

      if (player.isPossessing && player.possessedFurniture) {

          btnPossessIcon.textContent = '🧹';
        } else if (toolType === 'candle' || toolType === 'fire_poker') {
          stealthBadge.textContent = `🔥 FIRE TOOL (BURNS WEBS)`;
          stealthBadge.className = 'hud-stealth-pill tool-mode';
          btnPossessText.textContent = 'EJECT';
          btnPossessIcon.textContent = '🔥';
        } else if (toolType === 'tv') {

    /* Trigger Distraction Waves */
    function triggerDistractionWave(sourceX, sourceY, type) {
      audio.playDistractionRing();
      triggerScreenShake(4, 0.2);

      lureWaves.push({
        x: sourceX,
        y: sourceY,
        radius: 10,
        maxRadius: 280,
        type: type,
        life: 1.6
      });

      npcs.forEach(npc => {
        if (npc.state === 'slipped') return;
        const dist = Math.hypot(npc.x - sourceX, npc.y - sourceY);
        if (dist <= 300) {
          npc.state = 'distracted';
          npc.speechText = (type === 'clock' ? '⏰ WHAT IS THAT RINGING?!' : (type === 'trap' ? '👟 SQUEAKING SHOES?!' : '📺 WHO TURNED ON THE TV?!'));
          npc.speechTimer = 2.8;

          const curGridX = Math.floor(npc.x / TILE_SIZE);
          const curGridY = Math.floor(npc.y / TILE_SIZE);
          const targetGridX = Math.floor(sourceX / TILE_SIZE);
          const targetGridY = Math.floor(sourceY / TILE_SIZE);

          npc.currentPath = findBFSPath(curGridX, curGridY, targetGridX, targetGridY);
          npc.pathIndex = 0;
        }
      });
    }

    /* Place Squeaky Shoes Decoy Trap */
    function placeSqueakyTrap() {
      if (!upgrades.squeaky_shoes.owned) {
        floatingTexts.push({ text: "BUY TRAP IN SHOP! [B]", x: player.x, y: player.y - 18, life: 1.0, color: "#f6c90e" });
        return;
      }

      audio.playSqueak();
      traps.push({
        x: player.x,
        y: player.y,
        life: 14.0,
        squeakInterval: 2.2,
        lastSqueak: gameTime
      });

      triggerDistractionWave(player.x, player.y, 'trap');
      floatingTexts.push({ text: "SQUEAKY TRAP PLACED! 👟", x: player.x, y: player.y - 18, life: 1.2, color: "#f6c90e" });
